[project]
name = "onlyalpha-data-source-binance"
version = "0.11.1"
description = "Public Binance data source for OnlyAlpha"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "onlyalpha==0.11.1",
    "onlyalpha-market-crypto==0.11.1",
    "websocket-client>=1.8,<2",
]

[project.entry-points."onlyalpha.data_sources"]
binance = "onlyalpha_plugin_binance.spot.data_source.factory:factory"
binance-usdm = "onlyalpha_plugin_binance.usdm.data_source:factory"

[build-system]
requires = ["hatchling>=1.26,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/onlyalpha_plugin_binance"]

[tool.uv.sources]
onlyalpha = { workspace = true }
onlyalpha-market-crypto = { workspace = true }

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src/onlyalpha_plugin_binance"]
