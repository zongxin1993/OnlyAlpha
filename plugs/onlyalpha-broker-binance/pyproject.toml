[project]
name = "onlyalpha-broker-binance"
version = "0.11.1"
description = "Binance broker integration for OnlyAlpha"
requires-python = ">=3.12,<3.13"
dependencies = ["onlyalpha==0.11.1", "websocket-client>=1.8,<2"]

[project.entry-points."onlyalpha.brokers"]
binance-spot = "onlyalpha_broker_binance.spot.factory:OnlyBinanceSpotBrokerFactory"

[build-system]
requires = ["hatchling>=1.26,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/onlyalpha_broker_binance"]

[tool.uv.sources]
onlyalpha = { workspace = true }
