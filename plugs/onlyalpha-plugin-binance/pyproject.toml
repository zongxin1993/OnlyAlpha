[project]
name = "onlyalpha-plugin-binance"
version = "0.9.8"
description = "Public Binance provider adapter for OnlyAlpha"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "onlyalpha==0.9.8",
    "onlyalpha-plugin-binance-spot==0.9.8",
    "onlyalpha-plugin-binance-usdm==0.9.8",
    "websocket-client>=1.8,<2",
]

[project.entry-points."onlyalpha.data_sources"]
binance = "onlyalpha_plugin_binance.spot.data_source.factory:factory"
binance-usdm = "onlyalpha_plugin_binance.usdm.data_source:factory"

[project.entry-points."onlyalpha.brokers"]
binance-spot = "onlyalpha_plugin_binance.spot.broker_factory:OnlyBinanceSpotBrokerFactory"

[build-system]
requires = ["hatchling>=1.26,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/onlyalpha_plugin_binance"]

[tool.uv.sources]
onlyalpha = { workspace = true }
onlyalpha-plugin-binance-spot = { workspace = true }
onlyalpha-plugin-binance-usdm = { workspace = true }

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src/onlyalpha_plugin_binance"]
