[package]
name = "onlyalpha-market-cn-ashare"
version = "0.11.1"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
build = false

[lib]
path = "src/lib.rs"

[lints]
workspace = true

[dependencies]
onlyalpha-domain = { path = "../../crates/domain" }
onlyalpha-fee = { path = "../../crates/fee" }
onlyalpha-settlement = { path = "../../crates/settlement" }
bigdecimal = { version = "=0.4.11", default-features = false, features = ["std"] }
serde_json = { version = "=1.0.154", default-features = false, features = ["std", "arbitrary_precision"] }

[dev-dependencies]
sha2 = { version = "=0.11.1", default-features = false }
