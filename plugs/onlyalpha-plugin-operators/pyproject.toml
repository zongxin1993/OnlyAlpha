[project]
name = "onlyalpha-plugin-operators"
version = "0.9.9"
description = "Official public mathematical Operator calculations for OnlyAlpha"
requires-python = ">=3.12,<3.13"
dependencies = ["onlyalpha==0.9.9"]

[project.entry-points."onlyalpha.calculations"]
official-operators = "onlyalpha_plugin_operators.registration:registrations"

[project.entry-points."onlyalpha.quant_assets"]
official-operators = "onlyalpha_plugin_operators.provider:quant_asset_provider"

[build-system]
requires = ["hatchling>=1.26,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/onlyalpha_plugin_operators"]

[tool.uv.sources]
onlyalpha = { workspace = true }
