[package]
name = "onlyalpha-broker-virtual"
version = "0.11.1"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
build = false

[lib]
path = "src/lib.rs"

[lints]
workspace = true

[dependencies]
onlyalpha-broker = { path = "../../crates/broker" }
rusqlite = { version = "=0.40.2", default-features = false, features = ["bundled"] }
onlyalpha-domain = { path = "../../crates/domain" }
bigdecimal = { version = "=0.4.11", default-features = false, features = ["std"] }
serde_json = { version = "=1.0.154", default-features = false, features = ["std", "arbitrary_precision"] }
