[project]
name = "onlyalpha-test-strategy-provider"
version = "0.9.9"
description = "Test-only Strategy provider fixture for OnlyAlpha"
requires-python = ">=3.12,<3.13"
dependencies = ["onlyalpha==0.9.9"]

[project.entry-points."onlyalpha.quant_assets"]
example-strategies = "onlyalpha_test_strategy_provider.provider:quant_asset_provider"

[build-system]
requires = ["hatchling>=1.26,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/onlyalpha_test_strategy_provider"]

[tool.hatch.build.targets.wheel.force-include]
"simple_momentum/research-definition.json" = "onlyalpha_test_strategy_provider/simple_momentum/research-definition.json"
"simple_momentum/metadata.json" = "onlyalpha_test_strategy_provider/simple_momentum/metadata.json"
