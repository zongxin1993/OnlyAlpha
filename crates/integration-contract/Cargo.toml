[package]
name = "onlyalpha-integration-contract"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
build = false
[lib]
path = "src/lib.rs"
[lints]
workspace = true
[dependencies]
serde = { version = "=1.0.229", default-features = false, features = ["std"] }
serde_json = { version = "=1.0.154", default-features = false, features = ["std", "arbitrary_precision", "raw_value"] }
bigdecimal = { version = "=0.4.11", default-features = false, features = ["std"] }
onlyalpha-metadata-json = { path = "../metadata-json" }

onlyalpha-domain = { path = "../domain" }
onlyalpha-market-data-construction = { path = "../market-data-construction" }

[dev-dependencies]
criterion = { workspace = true }

[[bench]]
name = "workload"
harness = false
