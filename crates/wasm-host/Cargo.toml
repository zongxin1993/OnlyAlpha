[package]
name = "onlyalpha-wasm-host"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
build = false

[lib]
path = "src/lib.rs"

[lints]
workspace = true

[dependencies]
onlyalpha-domain = { path = "../domain" }
onlyalpha-operators = { path = "../operators" }
serde_json = { version = "=1.0.154", default-features = false, features = ["std", "arbitrary_precision"] }
sha2 = { version = "=0.11.1", default-features = false }
wasmtime = { version = "=51.0.0", default-features = false, features = ["cranelift", "runtime", "std", "component-model"] }

[dev-dependencies]
wat = { version = "=1.263.0", default-features = false, features = ["component-model"] }
wit-parser = { version = "=0.263.0", default-features = false, features = ["std"] }
