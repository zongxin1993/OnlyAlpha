[package]
name = "onlyalpha-backtest"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
build = false
[lib]
path = "src/lib.rs"
[lints]
workspace = true
[dependencies]
onlyalpha-runtime = { path = "../runtime" }
onlyalpha-calculation-bridge = { path = "../calculation-bridge" }
onlyalpha-clock = { path = "../clock" }
onlyalpha-domain = { path = "../domain" }
onlyalpha-execution = { path = "../execution" }
onlyalpha-strategy = { path = "../strategy" }
onlyalpha-market-data = { path = "../market-data" }
serde_json = { version = "=1.0.154", default-features = false, features = ["std", "arbitrary_precision"] }

sha2 = { version = "=0.11.1", default-features = false }

[dev-dependencies]
rusqlite = { version = "=0.40.2", default-features = false, features = ["bundled"] }
flate2 = { version = "=1.1.10", default-features = false, features = ["rust_backend"] }
base64 = { version = "=0.23.1", default-features = false, features = ["std"] }
zstd = { version = "=0.13.3", default-features = false }
