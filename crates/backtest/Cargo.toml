[package]
name = "onlyalpha-backtest"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
build = false
[lib]
path = "src/lib.rs"
[lints]
workspace = true
[dependencies]
onlyalpha-runtime = { path = "../runtime" }
onlyalpha-broker = { path = "../broker" }
onlyalpha-broker-virtual = { path = "../../plugs/onlyalpha-broker-virtual" }
onlyalpha-calculation-bridge = { path = "../calculation-bridge" }
onlyalpha-clock = { path = "../clock" }
onlyalpha-domain = { path = "../domain" }
onlyalpha-execution = { path = "../execution" }
onlyalpha-strategy = { path = "../strategy" }
onlyalpha-market-data = { path = "../market-data" }
serde_json = { version = "=1.0.154", default-features = false, features = ["std", "arbitrary_precision"] }

sha2 = { version = "=0.11.1", default-features = false }

[dev-dependencies]
onlyalpha-calculation = { path = "../calculation" }

[[bench]]
name = "retained"
harness = false
