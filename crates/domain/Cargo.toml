[package]
name = "onlyalpha-domain"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

# Canonical financial domain; no runtime, infrastructure, Python bridge or concrete plugins.

[dependencies]
# Arbitrary integral magnitude; OnlyAlpha owns precision/rounding, never crate defaults.
bigdecimal = { version = "=0.4.11", default-features = false, features = ["std"] }
# Exact ratio reduction for the canonical terminating/non-terminating division policy.
num-integer = { version = "=0.1.46", default-features = false, features = ["std"] }
# Financial decimals stay strings; arbitrary_precision preserves unbounded integer facts.
serde_json = { version = "=1.0.154", default-features = false, features = ["std", "arbitrary_precision"] }

# Explicit TZif rules and canonical SHA-256; no system timezone discovery.
jiff = { version = "=0.2.38", default-features = false, features = ["std"] }
sha2 = { version = "=0.11.1", default-features = false }

# Exact TZif bytes and the complete Python UTC range; no OS discovery or clock APIs.
tz-rs = { version = "=0.7.3", default-features = false, features = ["alloc"] }
