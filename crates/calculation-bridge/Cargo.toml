[package]
name = "onlyalpha-calculation-bridge"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
[lib]
path = "src/lib.rs"
[lints]
workspace = true
[dependencies]
onlyalpha-operators = { path = "../operators" }
onlyalpha-predicates = { path = "../predicates" }
onlyalpha-strategy = { path = "../strategy" }
onlyalpha-market-data = { path = "../market-data" }
onlyalpha-calculation = { path = "../calculation" }
onlyalpha-domain = { path = "../domain" }
prost = { version = "=0.14.4" }
sha2 = { version = "=0.11.1", default-features = false }
serde_json = { version = "=1.0.154", default-features = false, features = ["std", "arbitrary_precision"] }
prost-build = { version = "=0.14.4", optional = true }
prost-types = { version = "=0.14.4", optional = true }

[features]
codegen = ["dep:prost-build", "dep:prost-types"]

[[bin]]
name = "gateway-codegen"
path = "src/codegen.rs"
required-features = ["codegen"]

[dev-dependencies]
criterion = { workspace = true }

[[bench]]
name = "workload"
harness = false
