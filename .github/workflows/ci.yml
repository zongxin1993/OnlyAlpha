name: Manual Cross-platform Distribution Smoke

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  PYTHONUTF8: "1"
  UV_NO_PROGRESS: "1"

jobs:
  # ---------------------------------------------------------------------------
  # Workspace、锁文件、包元数据和依赖方向。
  # ---------------------------------------------------------------------------
  metadata:
    name: Metadata and workspace
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.10.5"
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Check synchronized package versions
        run: uv run python scripts/version_sync.py check

      - name: Validate lock file
        run: uv lock --check

      - name: Synchronize complete workspace
        run: uv sync --frozen --all-packages --all-groups

      - name: Show workspace dependency tree
        run: uv tree

      - name: Validate installed distributions
        shell: bash
        run: |
          uv run python - <<'PY'
          from importlib.metadata import version

          expected = {
              "onlyalpha",
              "onlyalpha-plugin-broker-virtual",
              "onlyalpha-plugin-generic-t0-cash",
              "onlyalpha-plugin-cn-ashare",
              "onlyalpha-plugin-tushare",
          }

          failures: list[str] = []

          for distribution in sorted(expected):
              try:
                  installed_version = version(distribution)
              except Exception as exc:
                  failures.append(f"{distribution}: not installed: {exc}")
              else:
                  print(f"{distribution}=={installed_version}")

          if failures:
              raise SystemExit("\n".join(failures))
          PY

      - name: Reject Core imports of concrete plugins
        shell: bash
        run: |
          if git grep -n -E \
            '(^|[[:space:]])(from|import)[[:space:]]+onlyalpha_plugin_' \
            -- src/onlyalpha
          then
            echo "Core must not import concrete onlyalpha_plugin_* implementations."
            exit 1
          fi

      - name: Check patch whitespace
        run: git diff --check

  # ---------------------------------------------------------------------------
  # Core 在 Linux、Windows、macOS 上的质量门禁。
  # ---------------------------------------------------------------------------
  core:
    name: Core / ${{ matrix.os }}
    needs:
      - metadata
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.10.5"
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Synchronize workspace
        run: uv sync --frozen --all-packages --all-groups

      - name: Ruff lint Core, tests and examples
        run: uv run ruff check src tests examples

      - name: Ruff format Core, tests and examples
        run: uv run ruff format --check src tests examples

      - name: Mypy Core
        run: uv run mypy src/onlyalpha plugs/onlyalpha-plugin-operators/src/onlyalpha_plugin_operators plugs/onlyalpha-plugin-indicators/src/onlyalpha_plugin_indicators plugs/onlyalpha-plugin-targets/src/onlyalpha_plugin_targets

      - name: Run Core tests
        run: >-
          uv run pytest tests -q
          -m "not external
          and not requires_network
          and not requires_tushare"

  # ---------------------------------------------------------------------------
  # Tushare 是跨平台 DataSource 插件，三个平台都必须验证离线能力。
  # 真实 Token 和网络测试不进入普通 PR 门禁。
  # ---------------------------------------------------------------------------
  virtual-broker:
    name: Virtual Broker Plugin / ${{ matrix.os }}
    needs: [metadata]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Set up uv and Python
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.10.5"
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Synchronize workspace
        run: uv sync --frozen --all-packages --all-groups
      - name: Ruff lint Virtual Broker
        run: uv run ruff check plugs/onlyalpha-plugin-broker-virtual
      - name: Ruff format Virtual Broker
        run: uv run ruff format --check plugs/onlyalpha-plugin-broker-virtual
      - name: Mypy Virtual Broker
        run: uv run mypy --config-file plugs/onlyalpha-plugin-broker-virtual/pyproject.toml plugs/onlyalpha-plugin-broker-virtual/src/onlyalpha_plugin_broker_virtual
      - name: Test Virtual Broker
        run: uv run pytest plugs/onlyalpha-plugin-broker-virtual/tests -q

  tushare:
    name: Tushare / ${{ matrix.os }}
    needs:
      - metadata
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25

    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.10.5"
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Synchronize workspace
        run: uv sync --frozen --all-packages --all-groups

      - name: Ruff lint Tushare
        run: >-
          uv run ruff check
          plugs/onlyalpha-plugin-tushare/src
          plugs/onlyalpha-plugin-tushare/tests

      - name: Ruff format Tushare
        run: >-
          uv run ruff format --check
          plugs/onlyalpha-plugin-tushare/src
          plugs/onlyalpha-plugin-tushare/tests

      - name: Mypy Tushare
        run: >-
          uv run mypy
          plugs/onlyalpha-plugin-tushare/src/onlyalpha_plugin_tushare

      - name: Run offline Tushare tests
        run: >-
          uv run pytest
          plugs/onlyalpha-plugin-tushare/tests
          -q
          -m "not external
          and not requires_network
          and not requires_tushare"

  generic-market-product:
    name: Generic T0 Cash Market Product
    needs: [metadata]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.10.5"
          python-version: ${{ env.PYTHON_VERSION }}
      - run: uv sync --frozen --all-packages --all-groups
      - run: uv run ruff check plugs/onlyalpha-plugin-generic-t0-cash
      - run: uv run ruff format --check plugs/onlyalpha-plugin-generic-t0-cash
      - run: uv run mypy --config-file plugs/onlyalpha-plugin-generic-t0-cash/pyproject.toml plugs/onlyalpha-plugin-generic-t0-cash/src/onlyalpha_plugin_generic_t0_cash
      - run: uv run pytest plugs/onlyalpha-plugin-generic-t0-cash/tests -q

  cn-ashare-market-product:
    name: CN A-share Market Product
    needs: [metadata]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.10.5"
          python-version: ${{ env.PYTHON_VERSION }}
      - run: uv sync --frozen --all-packages --all-groups
      - run: uv run ruff check plugs/onlyalpha-plugin-cn-ashare
      - run: uv run ruff format --check plugs/onlyalpha-plugin-cn-ashare
      - run: uv run mypy --config-file plugs/onlyalpha-plugin-cn-ashare/pyproject.toml plugs/onlyalpha-plugin-cn-ashare/src/onlyalpha_plugin_cn_ashare
      - run: uv run pytest plugs/onlyalpha-plugin-cn-ashare/tests -q

  # ---------------------------------------------------------------------------
  # 产品级纵切面。
  #
  # 这里重复运行 integration/scenario 类测试是有意的：
  # Core job 负责完整测试；本 Job 提供稳定、独立的产品链门禁。
  # ---------------------------------------------------------------------------
  product-gates:
    name: Product scenarios and integration
    needs:
      - metadata
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.10.5"
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Synchronize workspace
        run: uv sync --frozen --all-packages --all-groups

      - name: Run integration tests
        run: uv run pytest tests/integration -q

      - name: Run named Scenario and Conformance tests
        shell: bash
        run: |
          uv run python - <<'PY'
          from __future__ import annotations

          import subprocess
          import sys
          from pathlib import Path

          selected = sorted(
              {
                  str(path)
                  for path in Path("tests").rglob("test_*.py")
                  if (
                      "scenario" in path.name.lower()
                      or "conformance" in path.name.lower()
                  )
              }
          )

          if not selected:
              raise SystemExit(
                  "No Scenario or Conformance tests were discovered. "
                  "Product coverage must not silently disappear."
              )

          print("Selected product tests:")
          for path in selected:
              print(f"  - {path}")

          subprocess.run(
              [
                  sys.executable,
                  "-m",
                  "pytest",
                  "-q",
                  *selected,
              ],
              check=True,
          )
          PY

      - name: Run integration demo suite
        run: uv run python -m tests.integration_demo.run_all

  # Maintained distribution: native HTTP service and exact isolated algorithm SDK.
  # Python reference-package installation in the jobs above is test tooling.
  build-smoke:
    name: Native runtime distribution smoke
    needs: [metadata, core, virtual-broker, tushare, generic-market-product, product-gates]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - name: Build the maintained runtime
        run: docker build --file deploy/Dockerfile.dev --target runtime --tag onlyalpha-runtime:ci .
      - name: Exercise pure native contract export without deployment inputs
        run: docker run --rm onlyalpha-runtime:ci --export-openapi > native-openapi.json
      - name: Check the installed algorithm boundary
        run: |
          expected_version="$(python3 -c 'import tomllib;print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          docker run --rm --env "EXPECTED_VERSION=$expected_version" --entrypoint /opt/onlyalpha/algorithms/bin/python onlyalpha-runtime:ci -I -c '
          import importlib.util
          import os
          from importlib.metadata import distribution, version
          import pyarrow
          import onlyalpha_calculation_worker.chart_worker
          assert version("onlyalpha") == os.environ["EXPECTED_VERSION"]
          for name in ("onlyalpha.application", "onlyalpha.runtime", "onlyalpha_http_server", "onlyalpha_agent_orchestrator"):
              assert importlib.util.find_spec(name) is None, name
          for name in ("onlyalpha", "onlyalpha-calculation-worker", "onlyalpha-plugin-indicators", "onlyalpha-gateway-protocol"):
              assert not distribution(name).entry_points, name
          '

  # ---------------------------------------------------------------------------
  # 为分支保护提供一个固定名称的最终检查。
  #
  # 后续可以将 "Required CI" 设置为 master 的必需状态检查，
  # 不需要把每个 matrix 子任务逐个加入分支保护。
  # ---------------------------------------------------------------------------
  required:
    name: Required CI
    if: ${{ always() }}
    needs:
      - metadata
      - core
      - virtual-broker
      - tushare
      - product-gates
      - build-smoke
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Verify all required jobs
        shell: bash
        run: |
          test "${{ needs.metadata.result }}" = "success"
          test "${{ needs.core.result }}" = "success"
          test "${{ needs.virtual-broker.result }}" = "success"
          test "${{ needs.tushare.result }}" = "success"
          test "${{ needs.product-gates.result }}" = "success"
          test "${{ needs.build-smoke.result }}" = "success"

          echo "All required OnlyAlpha CI gates passed."
