name: PR84 Dependency Lock Refresh

on:
  push:
    branches: [refactor/tests-docs-semantic-authority]

permissions:
  contents: write

env:
  PYTHON_VERSION: "3.12"
  UV_NO_PROGRESS: "1"

jobs:
  refresh-locks:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.10.5"
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: packages/onlyalpha-web-console/package-lock.json
      - name: Refresh Python audited dependency
        run: uv lock --upgrade-package httpx2
      - name: Refresh Web audited dependencies
        working-directory: packages/onlyalpha-web-console
        run: |
          npm install --package-lock-only --ignore-scripts
          npm update @redocly/openapi-core js-yaml --package-lock-only --ignore-scripts
      - name: Validate generated lock changes
        run: |
          git diff --check
          grep -A 2 'name = "httpx2"' uv.lock | grep -q 'version = "2.12.0"'
          grep -q '"vitest": "4.1.11"' packages/onlyalpha-web-console/package-lock.json
          grep -A 3 '"node_modules/@vitest/mocker"' packages/onlyalpha-web-console/package-lock.json | grep -q '"version": "4.1.11"'
          grep -A 3 '"node_modules/js-yaml"' packages/onlyalpha-web-console/package-lock.json | grep -q '"version": "4.3.2"'
      - name: Commit generated locks
        run: |
          if git diff --quiet -- uv.lock packages/onlyalpha-web-console/package-lock.json; then
            echo "Lockfiles already match the patched manifests."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add uv.lock packages/onlyalpha-web-console/package-lock.json
          git commit -m "fix(deps): refresh audited dependency locks"
          git push origin HEAD:${{ github.ref_name }}
