name: Third-Party Quality

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: third-party-quality-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  PYTHONUTF8: "1"
  UV_NO_PROGRESS: "1"

jobs:
  reviewdog:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      checks: write
      pull-requests: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: "0.10.5"
          python-version: ${{ env.PYTHON_VERSION }}
      - run: uv sync --frozen --all-packages --all-groups
      - uses: reviewdog/action-setup@d8a7baabd7f3e8544ee4dbde3ee41d0011c3a93f # v1.5.0
        with:
          reviewdog_version: v0.21.0
      - name: Annotate Ruff findings on the PR diff
        env:
          REVIEWDOG_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -o pipefail
          uv run ruff check src tests packages scripts --output-format=concise 2>&1 \
            | reviewdog \
                -efm='%f:%l:%c: %m' \
                -name='ruff' \
                -reporter=github-pr-check \
                -filter-mode=diff_context

  semgrep:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: "0.10.5"
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Run OnlyAlpha semantic security rules
        run: >-
          uvx --from semgrep==1.176.0 semgrep scan
          --config .semgrep/onlyalpha.yml
          --error
          --metrics=off
          src packages scripts

  diff-coverage:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: "0.10.5"
          python-version: ${{ env.PYTHON_VERSION }}
      - run: uv sync --frozen --all-packages --all-groups
      - name: Produce core coverage evidence
        run: uv run python scripts/test_suite.py core-full --coverage
      - name: Require changed core lines to be covered
        run: >-
          uvx --from diff-cover==10.4.1 diff-cover
          test-results/coverage/coverage.xml
          --compare-branch=origin/${{ github.base_ref }}
          --branch-coverage
          --show-uncovered
          --fail-under=90

  schemathesis:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: "0.10.5"
          python-version: ${{ env.PYTHON_VERSION }}
      - run: uv sync --frozen --all-packages --all-groups
      - name: Start the deterministic Research HTTP test surface
        run: |
          uv run python scripts/serve_research_web_e2e.py > /tmp/onlyalpha-schemathesis.log 2>&1 &
          echo $! > /tmp/onlyalpha-schemathesis.pid
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8000/openapi.json >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/onlyalpha-schemathesis.log
          exit 1
      - name: Fuzz the published OpenAPI surface for server errors
        run: >-
          uvx --from schemathesis==4.26.1 schemathesis run
          http://127.0.0.1:8000/openapi.json
          --checks=not_a_server_error
          --max-examples=25
          --generation-deterministic
          --workers=1
      - name: Stop Research HTTP test surface
        if: always()
        run: |
          if test -f /tmp/onlyalpha-schemathesis.pid; then
            kill "$(cat /tmp/onlyalpha-schemathesis.pid)" 2>/dev/null || true
          fi
          cat /tmp/onlyalpha-schemathesis.log 2>/dev/null || true

  testcontainers:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: "0.10.5"
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Verify disposable-container test infrastructure
        run: >-
          uv run --with testcontainers==4.15.0
          python scripts/testcontainers_smoke.py

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - id: dependency-graph
        name: Detect Dependency Graph availability
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if gh api \
            -H "Accept: application/vnd.github+json" \
            "/repos/$GITHUB_REPOSITORY/dependency-graph/compare/$BASE_SHA...$HEAD_SHA" \
            >/dev/null 2>&1; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::warning::GitHub Dependency Graph is disabled; Dependency Review is configured but cannot run until the repository capability is enabled."
          fi
      - name: Review dependency changes
        if: steps.dependency-graph.outputs.enabled == 'true'
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate
          show-patched-versions: true
          comment-summary-in-pr: on-failure

  pip-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: "0.10.5"
          python-version: ${{ env.PYTHON_VERSION }}
      - run: uv sync --frozen --all-packages --all-groups
      - name: Audit the resolved Python environment
        run: >-
          uv run --with pip-audit==2.10.1
          pip-audit
          --local
          --progress-spinner=off

  zizmor:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
      security-events: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Audit GitHub Actions workflows
        uses: zizmorcore/zizmor-action@3dc1ecc9bcb9e94e9b2c709687979e1298497054 # v0.6.2
        with:
          version: "1.29.0"
          persona: auditor
          min-severity: medium
          min-confidence: medium
          advanced-security: true

  third-party-quality-gate:
    if: always()
    needs:
      - reviewdog
      - semgrep
      - diff-coverage
      - schemathesis
      - testcontainers
      - dependency-review
      - pip-audit
      - zizmor
    runs-on: ubuntu-latest
    steps:
      - name: Require all applicable third-party checks
        env:
          EVENT_NAME: ${{ github.event_name }}
          REVIEWDOG_RESULT: ${{ needs.reviewdog.result }}
          SEMGREP_RESULT: ${{ needs.semgrep.result }}
          DIFF_COVERAGE_RESULT: ${{ needs.diff-coverage.result }}
          SCHEMATHESIS_RESULT: ${{ needs.schemathesis.result }}
          TESTCONTAINERS_RESULT: ${{ needs.testcontainers.result }}
          DEPENDENCY_REVIEW_RESULT: ${{ needs.dependency-review.result }}
          PIP_AUDIT_RESULT: ${{ needs.pip-audit.result }}
          ZIZMOR_RESULT: ${{ needs.zizmor.result }}
        run: |
          test "$SEMGREP_RESULT" = success
          test "$SCHEMATHESIS_RESULT" = success
          test "$TESTCONTAINERS_RESULT" = success
          test "$PIP_AUDIT_RESULT" = success
          test "$ZIZMOR_RESULT" = success
          if test "$EVENT_NAME" = pull_request; then
            test "$REVIEWDOG_RESULT" = success
            test "$DIFF_COVERAGE_RESULT" = success
            test "$DEPENDENCY_REVIEW_RESULT" = success
          else
            test "$REVIEWDOG_RESULT" = skipped
            test "$DIFF_COVERAGE_RESULT" = skipped
            test "$DEPENDENCY_REVIEW_RESULT" = skipped
          fi
