name: Final-SHA Certification

on:
  workflow_dispatch:
    inputs:
      subject_sha:
        description: Immutable full commit SHA to certify
        required: true
        type: string

permissions:
  contents: read
  security-events: write

concurrency:
  group: certification-${{ inputs.subject_sha }}
  cancel-in-progress: false

env:
  PYTHON_VERSION: "3.12"
  PYTHONUTF8: "1"
  UV_NO_PROGRESS: "1"
  SUBJECT_SHA: ${{ inputs.subject_sha }}

jobs:
  subject:
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.identity.outputs.sha }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.SUBJECT_SHA }}
      - id: identity
        name: Verify immutable certification subject
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "$SUBJECT_SHA"
          test "${#SUBJECT_SHA}" = 40
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  static:
    needs: subject
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.subject.outputs.sha }}
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.10.5"
          python-version: ${{ env.PYTHON_VERSION }}
      - run: uv sync --frozen --all-packages --all-groups
      - run: uv run ruff check src tests examples packages scripts
      - run: uv run ruff format --check src tests examples packages scripts
      - run: uv run mypy src/onlyalpha
      - run: uv run mypy packages/indicator/onlyalpha-plugin-indicators/src/onlyalpha_plugin_indicators packages/factor/onlyalpha-plugin-factors/src/onlyalpha_plugin_factors packages/target/onlyalpha-plugin-targets/src/onlyalpha_plugin_targets
      - run: uv run mypy --config-file packages/api/onlyalpha-api/pyproject.toml packages/api/onlyalpha-api/src/onlyalpha_api
      - run: uv run mypy --config-file packages/fake/onlyalpha-plugin-broker-virtual/pyproject.toml packages/fake/onlyalpha-plugin-broker-virtual/src/onlyalpha_plugin_broker_virtual
      - run: uv run mypy --config-file packages/market/onlyalpha-market-generic-t0-cash/pyproject.toml packages/market/onlyalpha-market-generic-t0-cash/src/onlyalpha_market_generic_t0_cash
      - run: uv run mypy --config-file packages/market/onlyalpha-market-cn-ashare/pyproject.toml packages/market/onlyalpha-market-cn-ashare/src/onlyalpha_market_cn_ashare
      - run: uv run mypy --config-file packages/provider/onlyalpha-plugin-tushare/pyproject.toml packages/provider/onlyalpha-plugin-tushare/src/onlyalpha_plugin_tushare
      - run: uv run mypy --config-file packages/provider/onlyalpha-plugin-miniqmt/pyproject.toml packages/provider/onlyalpha-plugin-miniqmt/src/onlyalpha_plugin_miniqmt
      - run: uv run lint-imports
      - run: uv run python scripts/version_sync.py check

  build:
    needs: subject
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.subject.outputs.sha }}
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.10.5"
          python-version: ${{ env.PYTHON_VERSION }}
      - run: uv sync --frozen --all-packages --all-groups
      - run: uv build --all-packages

  lanes:
    needs: subject
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        lane: [research-query, research-artifact, research-result, research-evaluation, research-sweep, research-factor, research-job, research-calculation, calculation, research-dataset, core-full, recovery, sim-recovery, ashare, miniqmt-contract]
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.subject.outputs.sha }}
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.10.5"
          python-version: ${{ env.PYTHON_VERSION }}
      - run: uv sync --frozen --all-packages --all-groups
      - run: uv run python scripts/test_suite.py ${{ matrix.lane }}
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: certification-${{ needs.subject.outputs.sha }}-${{ matrix.lane }}
          path: test-results/metrics/*.json

  coverage:
    needs: subject
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.subject.outputs.sha }}
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.10.5"
          python-version: ${{ env.PYTHON_VERSION }}
      - run: uv sync --frozen --all-packages --all-groups
      - name: Mandatory branch coverage
        env:
          HYPOTHESIS_PROFILE: ci
        run: uv run python scripts/test_suite.py core-full --coverage
      - name: Mandatory Calculation branch coverage
        run: uv run python scripts/test_suite.py calculation --coverage
      - name: Mandatory Research Calculation branch coverage
        run: uv run python scripts/test_suite.py research-calculation --coverage
      - name: Mandatory Research Factor branch coverage
        run: uv run python scripts/test_suite.py research-factor --coverage
      - name: Mandatory Research Evaluation branch coverage
        env:
          HYPOTHESIS_PROFILE: ci
        run: uv run python scripts/test_suite.py research-evaluation --coverage
      - name: Mandatory Research Result branch coverage
        run: uv run python scripts/test_suite.py research-result --coverage
      - name: Mandatory Research Artifact branch coverage
        run: uv run python scripts/test_suite.py research-artifact --coverage
      - name: Mandatory Research Query branch coverage
        run: uv run python scripts/test_suite.py research-query --coverage
      - name: Mandatory Research Job branch coverage
        run: uv run python scripts/test_suite.py research-job --coverage
      - name: Mandatory Research Sweep branch coverage
        run: uv run python scripts/test_suite.py research-sweep --coverage
      - name: Mandatory Research Dataset branch coverage
        run: uv run python scripts/test_suite.py research-dataset --coverage
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: certification-${{ needs.subject.outputs.sha }}-branch-coverage
          path: test-results/coverage/

  semgrep:
    needs: subject
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.subject.outputs.sha }}
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.10.5"
          python-version: ${{ env.PYTHON_VERSION }}
      - run: uv tool install semgrep
      - run: semgrep scan --config semgrep/onlyalpha.yml --test semgrep/onlyalpha.py
      - run: semgrep scan --config semgrep/onlyalpha.yml --error src packages

  dependency-audit:
    needs: subject
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.subject.outputs.sha }}
      - id: scan-time
        name: Capture advisory scan time
        run: echo "value=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
      - name: Prepare dependency audit evidence directory
        run: mkdir -p test-results/security
      - id: osv-scan
        name: Scan authoritative uv.lock with OSV-Scanner 2.5.0
        uses: google/osv-scanner-action/osv-scanner-action@06b2ab4348248b456ee06c9e953637f55e03504f # v2.5.0
        with:
          scan-args: |-
            --format=json
            --output-file=test-results/security/osv-results.json
            --lockfile=uv.lock
      - name: Build fail-closed dependency audit evidence
        if: always()
        env:
          AUDIT_SUBJECT_SHA: ${{ needs.subject.outputs.sha }}
          SCAN_OUTCOME: ${{ steps.osv-scan.outcome }}
          SCAN_TIME: ${{ steps.scan-time.outputs.value }}
        run: >-
          python scripts/dependency_audit.py
          --subject-sha "$AUDIT_SUBJECT_SHA"
          --lockfile uv.lock
          --scanner OSV-Scanner
          --scanner-version "2.5.0"
          --scan-time "$SCAN_TIME"
          --workflow-run "$GITHUB_RUN_ID"
          --workflow-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          --scan-outcome "$SCAN_OUTCOME"
          --scan-result test-results/security/osv-results.json
          --output test-results/security/dependency-audit-evidence.json
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: certification-${{ needs.subject.outputs.sha }}-dependency-audit
          path: test-results/security/
          if-no-files-found: error

  codeql:
    needs: subject
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.subject.outputs.sha }}
      - uses: github/codeql-action/init@v4
        with:
          languages: python
          queries: security-extended
      - uses: github/codeql-action/analyze@v4

  verdict:
    if: always()
    needs: [subject, static, build, lanes, coverage, semgrep, dependency-audit, codeql]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.subject_sha }}
      - name: Require every mandatory final-SHA gate
        env:
          SUBJECT_RESULT: ${{ needs.subject.result }}
          STATIC_RESULT: ${{ needs.static.result }}
          BUILD_RESULT: ${{ needs.build.result }}
          LANES_RESULT: ${{ needs.lanes.result }}
          COVERAGE_RESULT: ${{ needs.coverage.result }}
          SEMGREP_RESULT: ${{ needs.semgrep.result }}
          DEPENDENCY_AUDIT_RESULT: ${{ needs.dependency-audit.result }}
          CODEQL_RESULT: ${{ needs.codeql.result }}
        run: |
          python scripts/certification.py \
            --subject-sha "$SUBJECT_SHA" \
            --workflow-run "$GITHUB_RUN_ID" \
            --workflow-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            --gate "subject=$SUBJECT_RESULT" \
            --gate "static=$STATIC_RESULT" \
            --gate "build=$BUILD_RESULT" \
            --gate "lanes=$LANES_RESULT" \
            --gate "coverage=$COVERAGE_RESULT" \
            --gate "semgrep=$SEMGREP_RESULT" \
            --gate "dependency-audit=$DEPENDENCY_AUDIT_RESULT" \
            --gate "codeql=$CODEQL_RESULT" \
            --output certification-evidence.json
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: certification-${{ inputs.subject_sha }}
          path: certification-evidence.json
