name: Final-SHA Certification

on:
  workflow_dispatch:
    inputs:
      subject_sha:
        description: Immutable full commit SHA to certify
        required: true
        type: string

permissions:
  contents: read
  security-events: write

concurrency:
  group: certification-${{ inputs.subject_sha }}
  cancel-in-progress: false

env:
  PYTHON_VERSION: "3.12"
  PYTHONUTF8: "1"
  UV_NO_PROGRESS: "1"
  SUBJECT_SHA: ${{ inputs.subject_sha }}

jobs:
  subject:
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.identity.outputs.sha }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.SUBJECT_SHA }}
      - id: identity
        name: Verify immutable certification subject
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "$SUBJECT_SHA"
          test "${#SUBJECT_SHA}" = 40
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  static:
    needs: subject
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.subject.outputs.sha }}
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.10.5"
          python-version: ${{ env.PYTHON_VERSION }}
      - run: uv sync --frozen --all-packages --all-groups
      - run: uv run python scripts/test_suite.py release-static

  build:
    needs: subject
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.subject.outputs.sha }}
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.10.5"
          python-version: ${{ env.PYTHON_VERSION }}
      - run: uv sync --frozen --all-packages --all-groups
      - run: uv build --all-packages

  web:
    needs: subject
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.subject.outputs.sha }}
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.10.5"
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/onlyalpha-web/package-lock.json
      - run: uv sync --frozen --all-packages --all-groups
      - run: npm ci
        working-directory: apps/onlyalpha-web
      - name: web-static
        run: uv run python scripts/web_suite.py static
      - name: web-unit
        run: uv run python scripts/web_suite.py unit
      - name: web-build
        run: uv run python scripts/web_suite.py build
      - run: npx playwright install --with-deps chromium
        working-directory: apps/onlyalpha-web
      - name: web-e2e
        run: uv run python scripts/web_suite.py e2e

  lanes:
    needs: subject
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        lane: [strategy, research-definition, research-specification, research-run, research-command, research-execution, research-runtime, research-query, research-artifact, research-result, research-evaluation, research-sweep, research-factor, research-job, research-calculation, calculation, research-dataset, core-full, recovery, sim-recovery, ashare, miniqmt-contract]
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.subject.outputs.sha }}
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.10.5"
          python-version: ${{ env.PYTHON_VERSION }}
      - run: uv sync --frozen --all-packages --all-groups
      - run: uv run python scripts/test_suite.py ${{ matrix.lane }}
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: certification-${{ needs.subject.outputs.sha }}-${{ matrix.lane }}
          path: test-results/metrics/*.json

  gateway-protocol:
    needs: subject
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.subject.outputs.sha }}
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.10.5"
          python-version: ${{ env.PYTHON_VERSION }}
      - run: uv sync --frozen --all-packages --all-groups
      - id: baseline
        name: Select immutable Gateway compatibility baseline
        run: echo "sha=$(git rev-parse "$SUBJECT_SHA^")" >> "$GITHUB_OUTPUT"
      - run: uv run python scripts/gateway_protocol.py verify-lane --base "${{ steps.baseline.outputs.sha }}"

  semgrep:
    needs: subject
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.subject.outputs.sha }}
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.10.5"
          python-version: ${{ env.PYTHON_VERSION }}
      - run: uv tool install semgrep
      - run: semgrep scan --config semgrep/onlyalpha.yml --test semgrep/onlyalpha.py
      - run: semgrep scan --config semgrep/onlyalpha.yml --error src packages

  research-postgres:
    needs: subject
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16.10
        env:
          POSTGRES_USER: onlyalpha
          POSTGRES_PASSWORD: onlyalpha_test
          POSTGRES_DB: onlyalpha_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U onlyalpha -d onlyalpha_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      ONLYALPHA_TEST_POSTGRES_DSN: postgresql://onlyalpha:onlyalpha_test@127.0.0.1:5432/onlyalpha_test
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.subject.outputs.sha }}
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.10.5"
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/onlyalpha-web/package-lock.json
      - run: uv sync --frozen --all-packages --all-groups
      - run: npm ci
        working-directory: apps/onlyalpha-web
      - run: npx playwright install --with-deps chromium
        working-directory: apps/onlyalpha-web
      - run: sudo apt-get update && sudo apt-get install -y postgresql-client-16
      - run: uv run python scripts/test_suite.py research-product-closure
      - run: uv run python scripts/test_suite.py research-postgres

  dependency-audit:
    needs: subject
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.subject.outputs.sha }}
      - id: scan-time
        name: Capture advisory scan time
        run: echo "value=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
      - name: Prepare dependency audit evidence directory
        run: mkdir -p test-results/security
      - id: osv-scan
        name: Scan authoritative Python and Web locks with OSV-Scanner 2.5.0
        uses: google/osv-scanner-action/osv-scanner-action@06b2ab4348248b456ee06c9e953637f55e03504f # v2.5.0
        with:
          scan-args: |-
            --format=json
            --output-file=test-results/security/osv-results.json
            --lockfile=uv.lock
            --lockfile=apps/onlyalpha-web/package-lock.json
      - name: Build fail-closed dependency audit evidence
        if: always()
        env:
          AUDIT_SUBJECT_SHA: ${{ needs.subject.outputs.sha }}
          SCAN_OUTCOME: ${{ steps.osv-scan.outcome }}
          SCAN_TIME: ${{ steps.scan-time.outputs.value }}
        run: >-
          python scripts/dependency_audit.py
          --subject-sha "$AUDIT_SUBJECT_SHA"
          --lockfile uv.lock
          --lockfile apps/onlyalpha-web/package-lock.json
          --scanner OSV-Scanner
          --scanner-version "2.5.0"
          --scan-time "$SCAN_TIME"
          --workflow-run "$GITHUB_RUN_ID"
          --workflow-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          --scan-outcome "$SCAN_OUTCOME"
          --scan-result test-results/security/osv-results.json
          --output test-results/security/dependency-audit-evidence.json
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: certification-${{ needs.subject.outputs.sha }}-dependency-audit
          path: test-results/security/
          if-no-files-found: error

  codeql:
    needs: subject
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.subject.outputs.sha }}
      - uses: github/codeql-action/init@v4
        with:
          languages: python,javascript-typescript
          queries: security-extended
      - uses: github/codeql-action/analyze@v4

  verdict:
    if: always()
    needs: [subject, static, build, web, lanes, research-postgres, gateway-protocol, semgrep, dependency-audit, codeql]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.subject_sha }}
      - name: Require every mandatory final-SHA gate
        env:
          SUBJECT_RESULT: ${{ needs.subject.result }}
          STATIC_RESULT: ${{ needs.static.result }}
          BUILD_RESULT: ${{ needs.build.result }}
          WEB_RESULT: ${{ needs.web.result }}
          LANES_RESULT: ${{ needs.lanes.result }}
          RESEARCH_POSTGRES_RESULT: ${{ needs.research-postgres.result }}
          GATEWAY_PROTOCOL_RESULT: ${{ needs.gateway-protocol.result }}
          SEMGREP_RESULT: ${{ needs.semgrep.result }}
          DEPENDENCY_AUDIT_RESULT: ${{ needs.dependency-audit.result }}
          CODEQL_RESULT: ${{ needs.codeql.result }}
        # Coverage gate argument is intentionally disabled together with the coverage job.
        run: |
          python scripts/certification.py \
            --subject-sha "$SUBJECT_SHA" \
            --workflow-run "$GITHUB_RUN_ID" \
            --workflow-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            --gate "subject=$SUBJECT_RESULT" \
            --gate "static=$STATIC_RESULT" \
            --gate "build=$BUILD_RESULT" \
            --gate "web=$WEB_RESULT" \
            --gate "lanes=$LANES_RESULT" \
            --gate "research-postgres=$RESEARCH_POSTGRES_RESULT" \
            --gate "gateway-protocol=$GATEWAY_PROTOCOL_RESULT" \
            --gate "semgrep=$SEMGREP_RESULT" \
            --gate "dependency-audit=$DEPENDENCY_AUDIT_RESULT" \
            --gate "codeql=$CODEQL_RESULT" \
            --output certification-evidence.json
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: certification-${{ inputs.subject_sha }}
          path: certification-evidence.json
