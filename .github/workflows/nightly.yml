name: Nightly Exhaustive

on:
  schedule:
    - cron: "30 17 * * *"
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12"
  PYTHONUTF8: "1"
  UV_NO_PROGRESS: "1"

jobs:
  test-lanes:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        lane: [core-full, recovery, ashare, exhaustive]
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: uv sync --frozen --all-packages --all-groups
      - run: uv run python scripts/test_suite.py ${{ matrix.lane }}
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: nightly-${{ matrix.lane }}-metrics
          path: test-results/metrics/*.json

  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: uv sync --frozen --all-packages --all-groups
      - run: uv run python scripts/benchmark_test_lanes.py --lanes fast integration --workers 6 auto --dist worksteal --repeat 3
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: nightly-benchmark-metrics
          path: test-results/metrics/*.json

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: uv sync --frozen --all-packages --all-groups
      - run: uv build --all-packages
