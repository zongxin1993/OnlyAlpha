name: Nightly Heavy Quality

on:
  schedule:
    - cron: "30 17 * * *"
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12"
  PYTHONUTF8: "1"
  UV_NO_PROGRESS: "1"

jobs:
  duration-authority:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.10.5"
          python-version: ${{ env.PYTHON_VERSION }}
      - run: uv sync --frozen --all-packages --all-groups
      - run: python scripts/dev_verification.py prepare
      - name: Refresh canonical duration evidence for the next shard snapshot
        run: >-
          python scripts/dev_verification.py run -- python scripts/test_suite.py research-evaluation
          --workers 4
          --dist worksteal
          --store-durations
          --clean-durations
          --durations-path test-results/topology/test-durations-nightly.json
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: canonical-test-duration-authority
          path: test-results/topology/test-durations-nightly.json
          if-no-files-found: error

  exhaustive:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.10.5"
          python-version: ${{ env.PYTHON_VERSION }}
      - run: uv sync --frozen --all-packages --all-groups
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: packages/frontend/package-lock.json
      - run: npm ci
        working-directory: packages/frontend
      - run: python scripts/dev_verification.py prepare
      - name: Complete current Rust vectors, fault replay, SDK, serial databases and Web owners
        run: uv run python scripts/test_suite.py release
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: nightly-exhaustive-metrics
          path: test-results/metrics/*.json

  formal:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Prepare fixed symbolic validation tools
        run: python scripts/dev_verification.py prepare
      - name: Verify the source projection guards and a real rejected mutation
        run: >-
          python scripts/dev_verification.py run -- python -m pytest -q
          crates/domain/tests/test_timestamp_conversion_formal.py
      - name: Require all three source-linked timestamp contracts to be confirmed
        run: python scripts/dev_verification.py run -- python scripts/timestamp_conversion_formal.py
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: timestamp-conversion-formal-${{ github.sha }}
          path: test-results/timestamp-conversion-formal/
          if-no-files-found: warn

  mutation:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Prepare fixed Rust mutation tools
        run: python scripts/dev_verification.py prepare
      - name: Verify mutation result admission boundaries
        run: >-
          python scripts/dev_verification.py run -- python -m pytest -q
          scripts/tests/test_domain_mutation.py
      - name: Mutate current financial value owners with all Domain tests
        run: python scripts/dev_verification.py run -- python scripts/domain_mutation.py
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: nightly-domain-mutation
          path: test-results/domain-mutation/
          if-no-files-found: error
