name: Nightly Heavy Quality

on:
  schedule:
    - cron: "30 17 * * *"
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12"
  PYTHONUTF8: "1"
  UV_NO_PROGRESS: "1"

jobs:
  exhaustive:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.10.5"
          python-version: ${{ env.PYTHON_VERSION }}
      - run: uv sync --frozen --all-packages --all-groups
      - name: Exhaustive tests and Hypothesis profile
        env:
          HYPOTHESIS_PROFILE: exhaustive
        run: uv run python scripts/test_suite.py exhaustive
      - name: Exhaustive property examples
        env:
          HYPOTHESIS_PROFILE: exhaustive
        run: uv run pytest tests/property -q --tb=short --maxfail=1
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: nightly-exhaustive-metrics
          path: test-results/metrics/*.json

  formal:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.10.5"
          python-version: ${{ env.PYTHON_VERSION }}
      - run: uv sync --frozen --all-packages --all-groups
      - run: uv run crosshair check tests/formal/contracts.py --per_condition_timeout 30

  mutation:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.10.5"
          python-version: ${{ env.PYTHON_VERSION }}
      - run: uv sync --frozen --all-packages --all-groups
      - name: Domain value-object mutation baseline
        run: uv run mutmut run
      - name: Mutation summary
        if: always()
        run: uv run mutmut results

  performance:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.10.5"
          python-version: ${{ env.PYTHON_VERSION }}
      - run: uv sync --frozen --all-packages --all-groups
      - name: Prepare run-local performance evidence
        env:
          ASV_MACHINE: github-actions-${{ github.run_id }}
        run: |
          mkdir -p test-results/performance
          printf 'subject_sha=%s\nparent_sha=%s\nasv_version=%s\nmachine_identity=%s\nworkflow_run=%s\n' \
            "$(git rev-parse HEAD)" \
            "$(git rev-parse HEAD^)" \
            "$(uvx --from asv==0.6.6 asv --version)" \
            "$ASV_MACHINE" \
            "$GITHUB_RUN_ID" \
            > test-results/performance/metadata.txt
          uvx --from asv==0.6.6 asv machine --yes \
            --machine "$ASV_MACHINE" \
            --os "$(uname -s) $(uname -r)" \
            --arch "$(uname -m)" \
            --cpu "$(lscpu | awk -F: '/Model name/{sub(/^[[:space:]]+/, "", $2); print $2; exit}')" \
            --num_cpu "$(nproc)" \
            --ram "$(awk '/MemTotal/{print $2 "KB"; exit}' /proc/meminfo)"
      - name: Validate ASV benchmark definitions
        run: uvx --from asv==0.6.6 asv check
      - name: Record current-environment benchmark health
        run: >-
          uv run pytest tests/performance/test_quality_benchmarks.py
          -q --tb=short --benchmark-only
          --benchmark-json=test-results/performance/pytest-benchmark.json
      - name: Compare parent and candidate on the same runner
        env:
          ASV_MACHINE: github-actions-${{ github.run_id }}
        shell: bash
        run: |
          set -o pipefail
          uvx --from asv==0.6.6 asv continuous \
            --interleave-rounds \
            --machine "$ASV_MACHINE" \
            HEAD^ HEAD \
            | tee test-results/performance/asv-continuous.txt
      - name: Require complete performance evidence
        run: |
          test -s test-results/performance/metadata.txt
          test -s test-results/performance/pytest-benchmark.json
          test -s test-results/performance/asv-continuous.txt
          test -d .asv/results
          test "$(find .asv/results -type f -size +0c | wc -l)" -gt 0
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: nightly-performance-results
          path: |
            test-results/performance/
            .asv/results/
          if-no-files-found: error
