name: Nightly Heavy Quality

on:
  schedule:
    - cron: "30 17 * * *"
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12"
  PYTHONUTF8: "1"
  UV_NO_PROGRESS: "1"

jobs:
  exhaustive:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.10.5"
          python-version: ${{ env.PYTHON_VERSION }}
      - run: uv sync --frozen --all-packages --all-groups
      - name: Exhaustive tests and Hypothesis profile
        env:
          HYPOTHESIS_PROFILE: exhaustive
        run: uv run python scripts/test_suite.py exhaustive
      - name: Exhaustive property examples
        env:
          HYPOTHESIS_PROFILE: exhaustive
        run: uv run pytest tests/property -q --tb=short --maxfail=1
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: nightly-exhaustive-metrics
          path: test-results/metrics/*.json

  formal:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.10.5"
          python-version: ${{ env.PYTHON_VERSION }}
      - run: uv sync --frozen --all-packages --all-groups
      - run: uv run crosshair check tests/formal/contracts.py --per_condition_timeout 30

  mutation:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.10.5"
          python-version: ${{ env.PYTHON_VERSION }}
      - run: uv sync --frozen --all-packages --all-groups
      - name: Domain value-object mutation baseline
        run: uv run mutmut run
      - name: Mutation summary
        if: always()
        run: uv run mutmut results
