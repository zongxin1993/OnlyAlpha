name: Nightly Exhaustive

on:
  schedule:
    - cron: "30 17 * * *"
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12"
  PYTHONUTF8: "1"
  UV_NO_PROGRESS: "1"

jobs:
  exhaustive:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: uv sync --frozen --all-packages --all-groups
      - run: uv run python scripts/test_suite.py full
      - run: uv run python scripts/test_suite.py recovery
      - run: uv run python scripts/test_suite.py ashare
      - name: Determinism double run
        run: uv run python -m pytest tests/conformance/cn_a_share_cash/test_miniqmt_golden.py::test_miniqmt_golden_engine_result_is_deterministic -q
      - name: Worker metrics sample
        run: uv run python scripts/benchmark_test_lanes.py --lanes fast integration --workers 6 auto --dist worksteal --repeat 3
      - run: uv build --all-packages
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: nightly-test-metrics
          path: .test-metrics/*.json
