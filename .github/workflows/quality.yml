name: Layered Quality

on:
    pull_request:
        branches: [master]
    push:
        branches: [master]
    workflow_dispatch:

permissions:
    contents: read

jobs:
    unit-tests:
        runs-on: ubuntu-latest
        timeout-minutes: 20
        steps:
            - uses: actions/checkout@v6
            - name: Run Rust library unit tests
              run: python3 scripts/unit_tests.py
