name: Layered Quality

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: layered-quality-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  PYTHONUTF8: "1"
  UV_NO_PROGRESS: "1"

jobs:
  static:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.10.5"
          python-version: ${{ env.PYTHON_VERSION }}
      - run: uv sync --frozen --all-packages --all-groups
      - run: python scripts/dev_verification.py prepare
      - run: uv run python scripts/test_suite.py release-static

  rust-kernel:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - run: python scripts/dev_verification.py prepare
      - run: python scripts/dev_verification.py run -- python scripts/rust_kernel_check.py
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: rust-kernel-${{ github.sha }}
          path: test-results/rust-kernel/last-run.json
          if-no-files-found: warn

  architecture:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.10.5"
          python-version: ${{ env.PYTHON_VERSION }}
      - run: uv sync --frozen --all-packages --all-groups
      - run: uv run python scripts/test_suite.py architecture

  openapi-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.10.5"
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: packages/frontend/package-lock.json
      - run: uv sync --frozen --all-packages --all-groups
      - run: npm ci
        working-directory: packages/frontend
      - id: baseline
        name: Select immutable compatibility baseline
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            base_sha="$PR_BASE_SHA"
          elif [ "$EVENT_NAME" = "push" ]; then
            base_sha="$PUSH_BEFORE_SHA"
            if [ "$base_sha" = "0000000000000000000000000000000000000000" ]; then
              echo "A master push without a previous revision has no accepted compatibility baseline" >&2
              exit 1
            fi
          else
            base_sha="$(git rev-parse HEAD^)"
          fi
          case "$base_sha" in
            [0-9a-f][0-9a-f][0-9a-f][0-9a-f]*) ;;
            *) echo "Invalid OpenAPI compatibility baseline" >&2; exit 1 ;;
          esac
          echo "sha=$base_sha" >> "$GITHUB_OUTPUT"
      - run: python scripts/dev_verification.py prepare
      - run: python scripts/dev_verification.py run -- python scripts/openapi_contract.py verify --base "${{ steps.baseline.outputs.sha }}"
      - run: python scripts/dev_verification.py run -- python scripts/market_data_http_contract.py check
      - run: python scripts/dev_verification.py run -- python scripts/market_data_stream_contract.py check
      - run: python scripts/dev_verification.py run -- python -m pytest scripts/tests/test_openapi_contract.py -q

  python-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - run: python scripts/dev_verification.py prepare
      - name: Verify the complete current Python and native process contract
        run: python scripts/dev_verification.py run -- python scripts/test_suite.py python-contract

  private-asset-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - run: python scripts/dev_verification.py prepare
      - run: python scripts/dev_verification.py run -- python scripts/test_suite.py private-asset-contract
      - run: python scripts/dev_verification.py run -- python -m pytest -q packages/backend/tests/workers/test_installed_trading_nodes.py

  gateway-protocol:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.10.5"
          python-version: ${{ env.PYTHON_VERSION }}
      - run: uv sync --frozen --all-packages --all-groups
      - id: baseline
        name: Select immutable Gateway compatibility baseline
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            base_sha="$PR_BASE_SHA"
          elif [ "$EVENT_NAME" = "push" ]; then
            base_sha="$PUSH_BEFORE_SHA"
            if [ "$base_sha" = "0000000000000000000000000000000000000000" ]; then
              echo "A master push without a previous revision has no Gateway compatibility baseline" >&2
              exit 1
            fi
          else
            base_sha="$(git rev-parse HEAD^)"
          fi
          case "$base_sha" in
            [0-9a-f][0-9a-f][0-9a-f][0-9a-f]*) ;;
            *) echo "Invalid Gateway compatibility baseline" >&2; exit 1 ;;
          esac
          echo "sha=$base_sha" >> "$GITHUB_OUTPUT"
      - run: uv run python scripts/gateway_protocol.py verify-lane --base "${{ steps.baseline.outputs.sha }}"

  research-evaluation-shards:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - run: python scripts/dev_verification.py prepare
      - name: Run one disjoint current Research ABI shard
        run: >-
          python scripts/dev_verification.py run -- python scripts/test_suite.py research-evaluation
          --splits 4 --group ${{ matrix.shard }} --workers 2 --dist worksteal
          --metrics-path test-results/metrics/research-evaluation-shard-${{ matrix.shard }}.json
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: research-evaluation-shard-${{ matrix.shard }}-metrics
          path: test-results/metrics/research-evaluation-shard-${{ matrix.shard }}.json
          if-no-files-found: error

  research-evaluation-shard-gate:
    if: always() && github.event_name == 'pull_request'
    needs: [research-evaluation-shards, rust-kernel]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v6
        with:
          pattern: research-evaluation-shard-*-metrics
          path: test-results/metrics
          merge-multiple: true
      - run: python scripts/dev_verification.py prepare
      - name: Independently collect the complete current Research ABI lane
        run: >-
          python scripts/dev_verification.py run -- python scripts/test_suite.py research-evaluation
          --collect-only --no-parallel --collection-path test-results/metrics/research-evaluation-nodeids.json
      - name: Require all shards, native statistics and a complete disjoint union
        env:
          SHARDS_RESULT: ${{ needs.research-evaluation-shards.result }}
          NATIVE_RESULT: ${{ needs.rust-kernel.result }}
        run: |
          test "$SHARDS_RESULT" = success
          test "$NATIVE_RESULT" = success
          python scripts/test_topology.py \
            --validate-shards \
            test-results/metrics/research-evaluation-shard-1.json \
            test-results/metrics/research-evaluation-shard-2.json \
            test-results/metrics/research-evaluation-shard-3.json \
            test-results/metrics/research-evaluation-shard-4.json \
            --expected-nodeids-path test-results/metrics/research-evaluation-nodeids.json \
            --expected-commit "$GITHUB_SHA"

  native-quality-gate:
    if: always()
    needs: [rust-kernel, python-contract, private-asset-contract, database-compose, research-product-certification, native-conformance, research-evaluation-shard-gate]
    runs-on: ubuntu-latest
    steps:
      - name: Require every current native owner and the applicable shard proof
        env:
          EVENT_NAME: ${{ github.event_name }}
          RUST_RESULT: ${{ needs.rust-kernel.result }}
          PYTHON_RESULT: ${{ needs.python-contract.result }}
          PRIVATE_RESULT: ${{ needs.private-asset-contract.result }}
          DATABASE_RESULT: ${{ needs.database-compose.result }}
          RESEARCH_RESULT: ${{ needs.research-product-certification.result }}
          CONFORMANCE_RESULT: ${{ needs.native-conformance.result }}
          SHARD_RESULT: ${{ needs.research-evaluation-shard-gate.result }}
        run: |
          test "$RUST_RESULT" = success
          test "$PYTHON_RESULT" = success
          test "$PRIVATE_RESULT" = success
          test "$DATABASE_RESULT" = success
          test "$RESEARCH_RESULT" = success
          test "$CONFORMANCE_RESULT" = success
          if test "$EVENT_NAME" = pull_request; then
            test "$SHARD_RESULT" = success
          else
            test "$SHARD_RESULT" = skipped
          fi

  native-conformance:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - responsibility: durable-recovery
            packages: --package onlyalpha-runtime --package onlyalpha-execution --package onlyalpha-order --package onlyalpha-position --package onlyalpha-account --package onlyalpha-risk --package onlyalpha-strategy-ledger
          - responsibility: simulation-replay
            packages: --package onlyalpha-backtest --package onlyalpha-strategy --package onlyalpha-calculation-bridge --package onlyalpha-market-data --package onlyalpha-market-data-construction --package onlyalpha-market-crypto --package onlyalpha-backend
          - responsibility: cn-ashare
            packages: --package onlyalpha-market-cn-ashare --package onlyalpha-settlement --package onlyalpha-fee --package onlyalpha-margin
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - run: python scripts/dev_verification.py prepare
      - name: Verify the actual current responsibility owner
        run: python scripts/dev_verification.py run -- python scripts/rust_kernel_check.py ${{ matrix.packages }}

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.10.5"
          python-version: ${{ env.PYTHON_VERSION }}
      - run: uv sync --frozen --all-packages --all-groups
      - name: Build the maintained Rust runtime and isolated SDK
        run: docker build --file deploy/Dockerfile.dev --target runtime --tag onlyalpha-runtime:ci .

  research-product-certification:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - run: python scripts/dev_verification.py prepare
      - name: Verify native Research evidence and Backtest owner continuity
        run: python scripts/dev_verification.py run -- python scripts/test_suite.py research-product-certification

  database-compose:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - run: python scripts/dev_verification.py prepare
      - name: Verify current native database owners serially
        run: python scripts/dev_verification.py run -- python scripts/test_suite.py database --no-parallel

  web-product-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Validate the canonical Compose model
        run: docker compose -f deploy/docker-compose.dev.yml config --quiet
      - name: Prepare fixed native validation tools
        run: python scripts/dev_verification.py prepare
      - name: Verify the installed algorithm transport
        run: >-
          python scripts/dev_verification.py run -- python -m pytest -q
          packages/backend/tests/transport/test_chart_algorithm_closure.py
          packages/backend/tests/transport/test_trading_algorithm_session.py
          packages/backend/tests/transport/test_trading_algorithm_transport.py
      - name: Run the native Web Product journey
        run: deploy/run-web-e2e.sh
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: web-product-e2e-${{ github.sha }}
          path: test-results/web-e2e/
          if-no-files-found: warn

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.10.5"
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: packages/frontend/package-lock.json
      - run: uv sync --frozen --all-packages --all-groups
      - run: npm ci
        working-directory: packages/frontend
      - run: python scripts/dev_verification.py prepare
      - name: web-static
        run: python scripts/dev_verification.py run -- python scripts/web_suite.py static
      - name: web-unit
        run: uv run python scripts/web_suite.py unit
      - name: web-build
        run: uv run python scripts/web_suite.py build
      - run: npx playwright install --with-deps chromium
        working-directory: packages/frontend
      - name: web-e2e
        run: uv run python scripts/web_suite.py e2e

  dependency-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - id: scan-time
        name: Capture advisory scan time
        run: echo "value=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
      - name: Prepare dependency audit evidence directory
        run: mkdir -p test-results/security
      - id: osv-scan
        name: Scan authoritative Python and Web locks with OSV-Scanner 2.5.0
        uses: google/osv-scanner-action/osv-scanner-action@06b2ab4348248b456ee06c9e953637f55e03504f # v2.5.0
        with:
          scan-args: |-
            --format=json
            --output-file=test-results/security/osv-results.json
            --lockfile=uv.lock
            --lockfile=packages/frontend/package-lock.json
      - name: Build fail-closed dependency audit evidence
        if: always()
        env:
          SCAN_OUTCOME: ${{ steps.osv-scan.outcome }}
          SCAN_TIME: ${{ steps.scan-time.outputs.value }}
        run: >-
          python scripts/dependency_audit.py
          --subject-sha "$GITHUB_SHA"
          --lockfile uv.lock
          --lockfile packages/frontend/package-lock.json
          --scanner OSV-Scanner
          --scanner-version "2.5.0"
          --scan-time "$SCAN_TIME"
          --workflow-run "$GITHUB_RUN_ID"
          --workflow-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          --scan-outcome "$SCAN_OUTCOME"
          --scan-result test-results/security/osv-results.json
          --output test-results/security/dependency-audit-evidence.json
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: dependency-audit-${{ github.sha }}
          path: test-results/security/
          if-no-files-found: error

  quality-gate:
    if: always()
    needs: [static, rust-kernel, architecture, openapi-contract, python-contract, private-asset-contract, gateway-protocol, dependency-audit, native-quality-gate, research-product-certification, database-compose, web-product-e2e, build, web]
    runs-on: ubuntu-latest
    steps:
      - name: Require every independent gate
        env:
          RUST_KERNEL_RESULT: ${{ needs.rust-kernel.result }}
          STATIC_RESULT: ${{ needs.static.result }}
          ARCHITECTURE_RESULT: ${{ needs.architecture.result }}
          OPENAPI_CONTRACT_RESULT: ${{ needs.openapi-contract.result }}
          PYTHON_CONTRACT_RESULT: ${{ needs.python-contract.result }}
          PRIVATE_ASSET_CONTRACT_RESULT: ${{ needs.private-asset-contract.result }}
          GATEWAY_PROTOCOL_RESULT: ${{ needs.gateway-protocol.result }}
          DEPENDENCY_AUDIT_RESULT: ${{ needs.dependency-audit.result }}
          NATIVE_QUALITY_GATE_RESULT: ${{ needs.native-quality-gate.result }}
          RESEARCH_PRODUCT_CERTIFICATION_RESULT: ${{ needs.research-product-certification.result }}
          DATABASE_COMPOSE_RESULT: ${{ needs.database-compose.result }}
          WEB_PRODUCT_E2E_RESULT: ${{ needs.web-product-e2e.result }}
          BUILD_RESULT: ${{ needs.build.result }}
          WEB_RESULT: ${{ needs.web.result }}
        run: test "$RUST_KERNEL_RESULT" = success -a "$STATIC_RESULT" = success -a "$ARCHITECTURE_RESULT" = success -a "$OPENAPI_CONTRACT_RESULT" = success -a "$PYTHON_CONTRACT_RESULT" = success -a "$PRIVATE_ASSET_CONTRACT_RESULT" = success -a "$GATEWAY_PROTOCOL_RESULT" = success -a "$DEPENDENCY_AUDIT_RESULT" = success -a "$RESEARCH_PRODUCT_CERTIFICATION_RESULT" = success -a "$DATABASE_COMPOSE_RESULT" = success -a "$WEB_PRODUCT_E2E_RESULT" = success -a "$BUILD_RESULT" = success -a "$WEB_RESULT" = success -a "$NATIVE_QUALITY_GATE_RESULT" = success
