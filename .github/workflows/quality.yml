name: Layered Quality

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: layered-quality-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  PYTHONUTF8: "1"
  UV_NO_PROGRESS: "1"

jobs:
  static:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.10.5"
          python-version: ${{ env.PYTHON_VERSION }}
      - run: uv sync --frozen --all-packages --all-groups
      - run: uv run python scripts/test_suite.py release-static

  architecture:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.10.5"
          python-version: ${{ env.PYTHON_VERSION }}
      - run: uv sync --frozen --all-packages --all-groups
      - run: uv run python scripts/test_suite.py architecture

  openapi-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.10.5"
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: packages/onlyalpha-web-console/package-lock.json
      - run: uv sync --frozen --all-packages --all-groups
      - run: npm ci
        working-directory: packages/onlyalpha-web-console
      - id: baseline
        name: Select immutable compatibility baseline
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            base_sha="$PR_BASE_SHA"
          elif [ "$EVENT_NAME" = "push" ]; then
            base_sha="$PUSH_BEFORE_SHA"
            if [ "$base_sha" = "0000000000000000000000000000000000000000" ]; then
              echo "A master push without a previous revision has no accepted compatibility baseline" >&2
              exit 1
            fi
          else
            base_sha="$(git rev-parse HEAD^)"
          fi
          case "$base_sha" in
            [0-9a-f][0-9a-f][0-9a-f][0-9a-f]*) ;;
            *) echo "Invalid OpenAPI compatibility baseline" >&2; exit 1 ;;
          esac
          echo "sha=$base_sha" >> "$GITHUB_OUTPUT"
      - run: uv run python scripts/openapi_contract.py verify --base "${{ steps.baseline.outputs.sha }}"
      - run: uv run pytest tests/contracts/test_openapi_contract.py -q

  private-asset-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.10.5"
          python-version: ${{ env.PYTHON_VERSION }}
      - run: uv sync --frozen --all-packages --all-groups
      - run: uv run python scripts/test_suite.py private-asset-contract

  gateway-protocol:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.10.5"
          python-version: ${{ env.PYTHON_VERSION }}
      - run: uv sync --frozen --all-packages --all-groups
      - id: baseline
        name: Select immutable Gateway compatibility baseline
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            base_sha="$PR_BASE_SHA"
          elif [ "$EVENT_NAME" = "push" ]; then
            base_sha="$PUSH_BEFORE_SHA"
            if [ "$base_sha" = "0000000000000000000000000000000000000000" ]; then
              echo "A master push without a previous revision has no Gateway compatibility baseline" >&2
              exit 1
            fi
          else
            base_sha="$(git rev-parse HEAD^)"
          fi
          case "$base_sha" in
            [0-9a-f][0-9a-f][0-9a-f][0-9a-f]*) ;;
            *) echo "Invalid Gateway compatibility baseline" >&2; exit 1 ;;
          esac
          echo "sha=$base_sha" >> "$GITHUB_OUTPUT"
      - run: uv run python scripts/gateway_protocol.py verify-lane --base "${{ steps.baseline.outputs.sha }}"

  pr-lanes:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        lane: [strategy, research-definition, research-specification, research-run, research-command, research-execution, research-runtime, research-query, research-artifact, research-result, research-evaluation, research-sweep, research-factor, research-job, research-calculation, recovery, sim-recovery, ashare, miniqmt-contract]
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.10.5"
          python-version: ${{ env.PYTHON_VERSION }}
      - run: uv sync --frozen --all-packages --all-groups
      - run: uv run python scripts/test_suite.py ${{ matrix.lane }}
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: ${{ matrix.lane }}-metrics
          path: test-results/metrics/*.json

  main-lanes:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        lane: [strategy, research-definition, research-specification, research-run, research-command, research-execution, research-runtime, research-query, research-artifact, research-result, research-evaluation, research-sweep, research-factor, research-job, research-calculation, calculation, research-dataset, core-full, recovery, sim-recovery, ashare, miniqmt-contract]
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.10.5"
          python-version: ${{ env.PYTHON_VERSION }}
      - run: uv sync --frozen --all-packages --all-groups
      - run: uv run python scripts/test_suite.py ${{ matrix.lane }}
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: ${{ matrix.lane }}-metrics
          path: test-results/metrics/*.json

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.10.5"
          python-version: ${{ env.PYTHON_VERSION }}
      - run: uv sync --frozen --all-packages --all-groups
      - run: uv build --all-packages

  research-product-closure:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:18.6@sha256:4ef4dbc939d61acea57712655ddb4b4ab27419c913f94cca0cd57cb3ea3c2280
        env:
          POSTGRES_USER: onlyalpha
          POSTGRES_PASSWORD: onlyalpha_test
          POSTGRES_DB: onlyalpha_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U onlyalpha -d onlyalpha_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
      postgres16-upgrade-source:
        image: postgres:16.10@sha256:21f6013073bc6b92830a2129570e2f5ec42a6c734b5a985a41e83aa58f54c3c1
        env:
          POSTGRES_USER: onlyalpha
          POSTGRES_PASSWORD: onlyalpha_test
          POSTGRES_DB: onlyalpha_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U onlyalpha -d onlyalpha_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      ONLYALPHA_TEST_POSTGRES_DSN: postgresql://onlyalpha:onlyalpha_test@127.0.0.1:5432/onlyalpha_test
      ONLYALPHA_TEST_POSTGRES16_DSN: postgresql://onlyalpha:onlyalpha_test@127.0.0.1:5433/onlyalpha_test
      ONLYALPHA_POSTGRES_CLIENT_BIN_DIR: /usr/lib/postgresql/18/bin
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.10.5"
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: packages/onlyalpha-web-console/package-lock.json
      - run: uv sync --frozen --all-packages --all-groups
      - run: npm ci
        working-directory: packages/onlyalpha-web-console
      - run: npx playwright install --with-deps chromium
        working-directory: packages/onlyalpha-web-console
      - name: Install PostgreSQL 18 client tools
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          curl --fail --silent --show-error https://www.postgresql.org/media/keys/ACCC4CF8.asc \
            | sudo gpg --dearmor --yes -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.gpg
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.gpg] https://apt.postgresql.org/pub/repos/apt $(. /etc/os-release && echo "$VERSION_CODENAME")-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update
          sudo apt-get install -y postgresql-client-18
      - name: Verify exact PostgreSQL 18 client family
        run: |
          test "$("${ONLYALPHA_POSTGRES_CLIENT_BIN_DIR}/pg_dump" --version | awk '{print $3}' | cut -d. -f1)" = "18"
          test "$("${ONLYALPHA_POSTGRES_CLIENT_BIN_DIR}/pg_restore" --version | awk '{print $3}' | cut -d. -f1)" = "18"
          test "$("${ONLYALPHA_POSTGRES_CLIENT_BIN_DIR}/psql" --version | awk '{print $3}' | cut -d. -f1)" = "18"
      - run: uv run python scripts/test_suite.py research-product-closure

  database-compose:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
      - name: Validate production Compose model
        run: >-
          docker compose
          --project-directory deploy/compose
          --env-file deploy/compose/.env.production.example
          -f deploy/compose/compose.yaml
          -f deploy/compose/compose.production.yaml
          config --quiet
      - name: Run containerized real-database acceptance
        run: deploy/compose/run-acceptance.sh

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.10.5"
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: packages/onlyalpha-web-console/package-lock.json
      - run: uv sync --frozen --all-packages --all-groups
      - run: npm ci
        working-directory: packages/onlyalpha-web-console
      - name: web-static
        run: uv run python scripts/web_suite.py static
      - name: web-unit
        run: uv run python scripts/web_suite.py unit
      - name: web-build
        run: uv run python scripts/web_suite.py build
      - run: npx playwright install --with-deps chromium
        working-directory: packages/onlyalpha-web-console
      - name: web-e2e
        run: uv run python scripts/web_suite.py e2e

  dependency-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - id: scan-time
        name: Capture advisory scan time
        run: echo "value=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
      - name: Prepare dependency audit evidence directory
        run: mkdir -p test-results/security
      - id: osv-scan
        name: Scan authoritative Python and Web locks with OSV-Scanner 2.5.0
        uses: google/osv-scanner-action/osv-scanner-action@06b2ab4348248b456ee06c9e953637f55e03504f # v2.5.0
        with:
          scan-args: |-
            --format=json
            --output-file=test-results/security/osv-results.json
            --lockfile=uv.lock
            --lockfile=packages/onlyalpha-web-console/package-lock.json
      - name: Build fail-closed dependency audit evidence
        if: always()
        env:
          SCAN_OUTCOME: ${{ steps.osv-scan.outcome }}
          SCAN_TIME: ${{ steps.scan-time.outputs.value }}
        run: >-
          python scripts/dependency_audit.py
          --subject-sha "$GITHUB_SHA"
          --lockfile uv.lock
          --lockfile packages/onlyalpha-web-console/package-lock.json
          --scanner OSV-Scanner
          --scanner-version "2.5.0"
          --scan-time "$SCAN_TIME"
          --workflow-run "$GITHUB_RUN_ID"
          --workflow-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          --scan-outcome "$SCAN_OUTCOME"
          --scan-result test-results/security/osv-results.json
          --output test-results/security/dependency-audit-evidence.json
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: dependency-audit-${{ github.sha }}
          path: test-results/security/
          if-no-files-found: error

  quality-gate:
    if: always()
    needs: [static, architecture, openapi-contract, private-asset-contract, gateway-protocol, dependency-audit, pr-lanes, main-lanes, research-product-closure, database-compose, build, web]
    runs-on: ubuntu-latest
    steps:
      - name: Require every independent gate
        env:
          STATIC_RESULT: ${{ needs.static.result }}
          ARCHITECTURE_RESULT: ${{ needs.architecture.result }}
          OPENAPI_CONTRACT_RESULT: ${{ needs.openapi-contract.result }}
          PRIVATE_ASSET_CONTRACT_RESULT: ${{ needs.private-asset-contract.result }}
          GATEWAY_PROTOCOL_RESULT: ${{ needs.gateway-protocol.result }}
          DEPENDENCY_AUDIT_RESULT: ${{ needs.dependency-audit.result }}
          PR_LANES_RESULT: ${{ needs.pr-lanes.result }}
          MAIN_LANES_RESULT: ${{ needs.main-lanes.result }}
          RESEARCH_PRODUCT_CLOSURE_RESULT: ${{ needs.research-product-closure.result }}
          DATABASE_COMPOSE_RESULT: ${{ needs.database-compose.result }}
          BUILD_RESULT: ${{ needs.build.result }}
          WEB_RESULT: ${{ needs.web.result }}
        run: test "$STATIC_RESULT" = success -a "$ARCHITECTURE_RESULT" = success -a "$OPENAPI_CONTRACT_RESULT" = success -a "$PRIVATE_ASSET_CONTRACT_RESULT" = success -a "$GATEWAY_PROTOCOL_RESULT" = success -a "$DEPENDENCY_AUDIT_RESULT" = success -a "$RESEARCH_PRODUCT_CLOSURE_RESULT" = success -a "$DATABASE_COMPOSE_RESULT" = success -a "$BUILD_RESULT" = success -a "$WEB_RESULT" = success -a \( "$PR_LANES_RESULT" = success -o "$PR_LANES_RESULT" = skipped \) -a \( "$MAIN_LANES_RESULT" = success -o "$MAIN_LANES_RESULT" = skipped \)
