[project]
name = "onlyalpha-agent"
version = "0.1.0"
description = "Independent, bounded OnlyAlpha research orchestration service"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.34,<1",
    "langgraph==1.2.18",
    "langgraph-checkpoint-postgres==3.2.0",
    "psycopg[binary]>=3.2,<4",
    "cryptography>=50,<51",
    "PyJWT==2.15.1",
    "packaging>=24,<27",
]

[project.scripts]
onlyalpha-agent = "onlyalpha_agent.__main__:main"

[build-system]
requires = ["hatchling>=1.26,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/onlyalpha_agent"]
