[project]
name = "onlyalpha-authoring-execution-worker"
version = "0.11.1"
description = "Exact authoring execution-generation composition for OnlyAlpha Research"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = ["onlyalpha==0.11.1", "onlyalpha-backend-algorithms==0.11.1"]

[build-system]
requires = ["hatchling>=1.26,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/onlyalpha_authoring_execution_worker"]

[tool.uv.sources]
onlyalpha-backend-algorithms = { workspace = true }
onlyalpha = { workspace = true }

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src/onlyalpha_authoring_execution_worker"]
