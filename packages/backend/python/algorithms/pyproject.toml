[project]
name = "onlyalpha-backend-algorithms"
version = "0.11.1"
description = "Private backend algorithm executor build constituent"
requires-python = ">=3.12.0, <3.13.0"
dependencies = ["onlyalpha==0.11.1", "onlyalpha-plugin-indicators==0.11.1", "onlyalpha-gateway-protocol==0.11.1"]
[build-system]
requires = ["hatchling>=1.26,<2"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["src/onlyalpha_backend_algorithms"]
[tool.uv.sources]
onlyalpha = { workspace = true }
onlyalpha-plugin-indicators = { workspace = true }
onlyalpha-gateway-protocol = { workspace = true }
