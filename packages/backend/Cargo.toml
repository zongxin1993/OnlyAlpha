[package]
name = "onlyalpha-backend"
version = "0.11.1"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
build = false

[lib]
path = "src/lib.rs"

[lints]
workspace = true

[dependencies]
onlyalpha-observability = { path = "../../crates/observability" }
tracing = { version = "=0.1.44", default-features = false, features = ["std"] }
onlyalpha-market-crypto = { path = "../../plugs/onlyalpha-market-crypto" }
onlyalpha-backtest = { path = "../../crates/backtest" }
onlyalpha-account = { path = "../../crates/account" }
arrow-array = { version = "=59.3.2", default-features = false }
arrow-schema = { version = "=59.3.2", default-features = false }
parquet = { version = "=59.3.2", default-features = false, features = ["arrow", "zstd", "crc"] }
bigdecimal = { version = "=0.4.11", default-features = false, features = ["std"] }
onlyalpha-domain = { path = "../../crates/domain" }
onlyalpha-market-data-construction = { path = "../../crates/market-data-construction" }
onlyalpha-market-data = { path = "../../crates/market-data" }
onlyalpha-metadata-json = { path = "../../crates/metadata-json" }
onlyalpha-calculation-bridge = { path = "../../crates/calculation-bridge" }
onlyalpha-data-source-binance = { path = "../../plugs/onlyalpha-data-source-binance" }
onlyalpha-data-source-tushare = { path = "../../plugs/onlyalpha-data-source-tushare" }
futures-util = { version = "=0.3.34", default-features = false, features = ["sink", "std"] }
tokio-tungstenite = { version = "=0.30.0", default-features = false, features = ["handshake"] }
onlyalpha-integration-contract = { path = "../../crates/integration-contract" }
tokio-postgres = { version = "=0.7.18", default-features = false, features = ["runtime"] }
# Maintained URI grammar and safe descriptor-relative filesystem operations.
http = { version = "=1.5.0", default-features = false, features = ["std"] }
rustix = { version = "=1.1.5", default-features = false, features = ["fs", "process", "std"] }
serde = { version = "=1.0.229", default-features = false, features = ["derive", "std"] }
serde_json = { version = "=1.0.154", default-features = false, features = ["arbitrary_precision", "raw_value", "std"] }
sha2 = { version = "=0.11.1", default-features = false, features = ["zeroize"]}
subtle = { version = "=2.6.1", default-features = false }
# OS entropy for the node-local Human session; never canonical trading identity.
getrandom = { version = "=0.4.3", default-features = false }
# Wipe the owned protected startup key/config read buffer on every exit.
zeroize = { version = "=1.9.1", default-features = false, features = ["alloc"] }

# Native REST transport consumers; no HTTP2, WS or TLS on this adapter.
axum = { version = "=0.8.9", default-features = false, features = ["json"] }
hyper = { version = "=1.12.0", default-features = false, features = ["http1", "server"] }
hyper-util = { version = "=0.1.21", default-features = false, features = ["tokio", "service"] }
tokio = { version = "=1.54.1", default-features = false, features = ["io-util", "macros", "net", "rt", "signal", "sync", "time"] }
percent-encoding = { version = "=2.3.2", default-features = false, features = ["std"] }

httparse = { version = "=1.10.1", default-features = false, features = ["std"] }

# One code-first route/DTO declaration drives actual serving and pure OpenAPI export.
utoipa = { version = "=6.0.0", default-features = false, features = ["macros"] }
utoipa-axum = { version = "=0.3.0", default-features = false }
onlyalpha-calculation = { path = "../../crates/calculation" }
onlyalpha-indicators = { path = "../../crates/indicators" }
reqwest = { version = "=0.13.5", default-features = false, features = ["rustls"] }
base64 = { version = "=0.23.1", default-features = false, features = ["alloc"] }
aes-gcm = { version = "=0.11.1", default-features = false, features = ["aes", "alloc", "zeroize"] }
hkdf = { version = "=0.13.0", default-features = false }
hmac = { version = "=0.13.0", default-features = false, features = ["zeroize"] }
onlyalpha-strategy = { path = "../../crates/strategy" }

[target.'cfg(target_os = "linux")'.dependencies]
libc = { version = "=0.2.191", default-features = false }
seccompiler = { version = "=0.5.0", default-features = false }

[dev-dependencies]
tracing-subscriber = { version = "=0.3.23", default-features = false, features = ["registry", "std"] }
onlyalpha-runtime = { path = "../../crates/runtime" }
onlyalpha-clock = { path = "../../crates/clock" }
hyper = { version = "=1.12.0", default-features = false, features = ["http1", "client"] }
tokio = { version = "=1.54.1", default-features = false, features = ["test-util"] }

