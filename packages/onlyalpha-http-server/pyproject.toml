[project]
name = "onlyalpha-http-server"
version = "0.9.9"
description = "OnlyAlpha Product Research HTTP API"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "onlyalpha==0.9.9",
    "fastapi>=0.116,<1",
    "pydantic>=2.11,<3",
    "uvicorn>=0.35,<1",
]

[dependency-groups]
dev = [
    "httpx>=0.28,<1",
    "httpx2>=2,<3",
    "pytest>=9.0.3",
]

[project.scripts]
onlyalpha-http-server = "onlyalpha_http_server.main:main"

[build-system]
requires = ["hatchling>=1.26,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/onlyalpha_http_server"]

[tool.uv.sources]
onlyalpha = { workspace = true }

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src/onlyalpha_http_server"]
