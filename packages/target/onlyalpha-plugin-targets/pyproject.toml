[project]
name = "onlyalpha-plugin-targets"
version = "0.8.3"
description = "Official Research Evaluation Target calculations for OnlyAlpha"
requires-python = ">=3.12,<3.13"
dependencies = ["onlyalpha==0.8.3"]

[project.entry-points."onlyalpha.calculations"]
official-targets = "onlyalpha_plugin_targets.registration:registrations"

[build-system]
requires = ["hatchling>=1.26,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/onlyalpha_plugin_targets"]

[tool.uv.sources]
onlyalpha = { workspace = true }
