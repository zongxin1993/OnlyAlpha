[project]
name = "onlyalpha-agent-orchestrator"
version = "0.9.9"
description = "Fail-closed runtime assembly boundary for OnlyAlpha Agent orchestration"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = ["onlyalpha==0.9.9"]

[build-system]
requires = ["hatchling>=1.26,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/onlyalpha_agent_orchestrator"]

[tool.uv.sources]
onlyalpha = { workspace = true }

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src/onlyalpha_agent_orchestrator"]
