[project]
name = "onlyalpha-agent-orchestrator"
version = "0.9.9"
description = "Fail-closed runtime assembly boundary for OnlyAlpha Agent orchestration"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = ["fastapi>=0.115,<1", "onlyalpha==0.9.9", "uvicorn>=0.34,<1"]

[project.scripts]
onlyalpha-agent = "onlyalpha_agent_orchestrator.node_main:main"

[build-system]
requires = ["hatchling>=1.26,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/onlyalpha_agent_orchestrator"]

[tool.hatch.build]
exclude = [
    "src/onlyalpha_agent_orchestrator/_build_provenance.json",
    "src/onlyalpha_agent_orchestrator/_build_provenance.sha256",
]

[tool.hatch.build.hooks.custom]
path = "hatch_build.py"

[tool.uv.sources]
onlyalpha = { workspace = true }

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src/onlyalpha_agent_orchestrator"]
