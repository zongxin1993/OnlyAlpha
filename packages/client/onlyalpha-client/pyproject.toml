[project]
name = "onlyalpha-client"
version = "0.9.6"
description = "OpenAPI-derived Python client for the OnlyAlpha Product Control Plane"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "httpx>=0.28,<1",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]

[project.scripts]
onlyalpha-client = "onlyalpha_client.cli:main"

[build-system]
requires = ["hatchling>=1.26,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/onlyalpha_client"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src/onlyalpha_client"]
