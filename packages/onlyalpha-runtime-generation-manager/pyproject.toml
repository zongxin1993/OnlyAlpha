[project]
name = "onlyalpha-runtime-generation-manager"
version = "0.10.21"
description = "Immutable artifact verification and durable runtime-generation activation for OnlyAlpha"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = ["onlyalpha==0.10.21", "onlyalpha-calculation-worker==0.10.21"]

[project.entry-points."onlyalpha.runtime_generation_work_authority"]
manager = "onlyalpha_runtime_generation_manager.entrypoint:runtime_generation_work_authority"

[project.entry-points."onlyalpha.calculation_generation_context"]
manager = "onlyalpha_runtime_generation_manager.entrypoint:calculation_generation_context"

[build-system]
requires = ["hatchling>=1.26,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/onlyalpha_runtime_generation_manager"]

[tool.uv.sources]
onlyalpha = { workspace = true }
onlyalpha-calculation-worker = { workspace = true }

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src/onlyalpha_runtime_generation_manager"]
