[project]
name = "onlyalpha-runtime-generation-manager"
version = "0.11.1"
description = "Immutable artifact verification and durable runtime-generation activation for OnlyAlpha"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = ["onlyalpha==0.11.1", "onlyalpha-calculation-worker==0.11.1", "onlyalpha-backend-algorithms==0.11.1"]

[build-system]
requires = ["hatchling>=1.26,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/onlyalpha_runtime_generation_manager"]

[tool.uv.sources]
onlyalpha-backend-algorithms = { workspace = true }
onlyalpha = { workspace = true }
onlyalpha-calculation-worker = { workspace = true }

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src/onlyalpha_runtime_generation_manager"]
