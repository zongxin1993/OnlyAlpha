version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
build = false
[lib]
path = "rust/lib.rs"
[lints]
workspace = true
[dependencies]
serde = { version = "=1.0.229", default-features = false, features = ["std"] }
