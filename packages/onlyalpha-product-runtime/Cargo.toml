[package]
name = "onlyalpha-product-runtime"
version = "0.11.1"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
build = false

[lib]
path = "rust/lib.rs"

[lints]
workspace = true

[dependencies]
onlyalpha-calculation = { path = "../../crates/onlyalpha-kernel/calculation" }
onlyalpha-calculation-bridge = { path = "../../crates/onlyalpha-calculation-bridge" }
# Existing bounded ClickHouse client protocol, no Product HTTP ingress.
reqwest = { version = "=0.13.5", default-features = false, features = ["rustls"] }
onlyalpha-market-data-construction = { path = "../../crates/onlyalpha-kernel/market_data/construction" }
# Canonical WAL evidence uses the existing base64 wire representation. Reuse the
# already locked maintained codec, not a handwritten decoder.
base64 = { version = "=0.23.1", default-features = false, features = ["alloc"] }
onlyalpha-metadata-json = { path = "../../crates/onlyalpha-metadata-json" }
onlyalpha-integration-contract = { path = "../../crates/onlyalpha-integration-contract" }
onlyalpha-domain = { path = "../../crates/onlyalpha-kernel/domain" }
# PostgreSQL is Product persistence, never a Kernel dependency. tokio-postgres
# (rust-postgres maintainers, MIT/Apache-2.0) owns the wire protocol and SCRAM;
# no hand-written transport/crypto or optional type ecosystems are enabled.
# Docs/security history: https://docs.rs/tokio-postgres/0.7.18/ and
# https://github.com/rust-postgres/rust-postgres/security/advisories .
# Effective features, upstream fixes, licenses and replacement cost are in
# docs/rust-product-backend.md. Inspect the exact locked graph in review; absence of a
# published advisory does not certify the closure. TLS policy belongs to the
# node's explicit connection composition, not a hidden NoTls fallback here.
tokio-postgres = { version = "=0.7.18", default-features = false, features = ["runtime"] }
# Source credential hashing and fixed-length comparison; no custom crypto.
# subtle is used instead of the experimental PG-transitive ctutils direct API.
sha2 = { version = "=0.11.1", default-features = false, features = ["zeroize"] }
subtle = { version = "=2.6.1", default-features = false }

# Existing Watchlist records and exact raw Integration JSON identity.
# RawValue/Visitor preserve ordinary object keys even when they match Serde
# implementation markers. No custom JSON parser or direct float formatter.
serde = { version = "=1.0.229", default-features = false, features = ["std"] }
serde_json = { version = "=1.0.154", default-features = false, features = ["std", "arbitrary_precision", "raw_value"] }

# Credential AES256-GCM and keyed command commitment. Exact feature/security
# rationale is owned by docs/rust-product-backend.md; no custom cryptography.
aes-gcm = { version = "=0.11.1", default-features = false, features = ["aes", "alloc", "zeroize"] }
hkdf = { version = "=0.13.0", default-features = false }
hmac = { version = "=0.13.0", default-features = false, features = ["zeroize"] }
zeroize = { version = "=1.9.1", default-features = false, features = ["alloc"] }
getrandom = { version = "=0.4.3", default-features = false }

# The actual authority session owns its executor driver and cancellation boundary.
tokio = { version = "=1.54.1", default-features = false, features = ["rt", "sync", "time", "macros"] }

onlyalpha-strategy = { path = "../../crates/onlyalpha-kernel/strategy" }
rustix = { version = "=1.1.5", default-features = false, features = ["std", "fs", "process"] }

[[example]]
name = "command-postgres-probe"
path = "tests/support/postgres_probe.rs"
