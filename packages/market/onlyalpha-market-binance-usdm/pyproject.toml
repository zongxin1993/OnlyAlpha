[project]
name = "onlyalpha-market-binance-usdm"
version = "0.9.8"
description = "Binance USD-M Market Product plugin for OnlyAlpha"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = ["onlyalpha==0.9.8"]

[project.entry-points."onlyalpha.market_products"]
binance-usdm = "onlyalpha_market_binance_usdm.factory:OnlyBinanceUsdmMarketProductFactory"

[build-system]
requires = ["hatchling>=1.26,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/onlyalpha_market_binance_usdm"]

[tool.uv.sources]
onlyalpha = { workspace = true }

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src/onlyalpha_market_binance_usdm"]
