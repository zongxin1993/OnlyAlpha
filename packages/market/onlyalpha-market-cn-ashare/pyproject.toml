[project]
name = "onlyalpha-market-cn-ashare"
version = "0.4.2"
description = "CN A-share Cash Market Product plugin for OnlyAlpha"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = ["onlyalpha==0.4.2"]

[project.entry-points."onlyalpha.market_products"]
cn-ashare = "onlyalpha_market_cn_ashare.factory:OnlyCnAshareMarketProductFactory"

[dependency-groups]
dev = ["mypy>=1.15", "pytest>=8.4", "pytest-cov>=6", "ruff>=0.11"]

[build-system]
requires = ["hatchling>=1.26,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/onlyalpha_market_cn_ashare"]

[tool.uv.sources]
onlyalpha = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src/onlyalpha_market_cn_ashare"]
