[workspace]
members = ["plugs/onlyalpha-plugin-binance", "plugs/onlyalpha-plugin-tushare", "crates/metadata-json", "crates/integration-contract", "packages/backend", "crates/backtest", "crates/runtime", "crates/margin","crates/settlement","crates/broker",
    "crates/fee", "crates/execution", "crates/risk", "crates/strategy-ledger", "crates/account", "crates/position", "crates/order", "crates/strategy", "crates/calculation-bridge", "crates/domain", "crates/calculation", "crates/predicates", "crates/clock", "crates/event", "crates/market-data-construction", "crates/market-data"]
resolver = "3"

[workspace.package]
version = "0.11.1"
edition = "2024"
rust-version = "1.99.1"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"

[profile.dev]
overflow-checks = true
panic = "unwind"

[profile.release]
overflow-checks = true
panic = "unwind"
