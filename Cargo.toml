[workspace]
members = ["packages/onlyalpha-gateway-protocol", "packages/onlyalpha-calculation-worker", "crates/onlyalpha-kernel/domain", "crates/onlyalpha-kernel/calculation", "crates/onlyalpha-kernel/core", "crates/onlyalpha-kernel/clock", "crates/onlyalpha-kernel/event", "crates/onlyalpha-kernel/market_data/state", "crates/onlyalpha-kernel/market_data/construction", "crates/onlyalpha-kernel/market_data/delivery"]
resolver = "3"

[workspace.package]
version = "0.10.10"
edition = "2024"
rust-version = "1.99.1"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"

[profile.dev]
overflow-checks = true
panic = "unwind"

[profile.release]
overflow-checks = true
panic = "unwind"
