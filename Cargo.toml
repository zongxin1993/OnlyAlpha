[workspace]
members = ["crates/onlyalpha-kernel"]
resolver = "3"

[workspace.package]
version = "0.10.5"
edition = "2024"
rust-version = "1.99.1"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"

[profile.dev]
overflow-checks = true
panic = "unwind"

[profile.release]
overflow-checks = true
panic = "unwind"
