[project]
name = "onlyalpha"
version = "0.11.1"
description = "A modular, deterministic quantitative trading system skeleton"
readme = "README.md"
requires-python = ">=3.12.0, <3.13.0"
dependencies = [
    "onlyalpha-gateway-protocol==0.11.1",
    "cryptography>=50,<51",
    "filelock==3.31.2",
    "pyarrow>=21.0.0",
    "psycopg[binary]>=3.2,<4",
    "pyyaml>=6.0.2",
    "tzdata==2026.3",
]

[dependency-groups]
compose-acceptance = [
    "build>=1.2",
    "coverage>=7.15.2",
    "grpcio-tools==1.73.1",
    "hatchling>=1.26,<2",
    "hypothesis>=6.165.5",
    "httpx2>=2.12,<3",
    "import-linter>=2.13",
    "mypy>=1.15",
    "onlyalpha-test-plugin",
    "onlyalpha-test-factor-provider",
    "pytest>=9.0.3",
    "pytest-cov>=6",
    "pytest-xdist>=3.8.0",
    "pytest-split==0.11.0",
    "pytest-timeout>=2.3.1,<3",
    "ruff>=0.11",
    "types-grpcio==1.0.0.20250703",
    "types-protobuf==6.30.2.20250809",
]
dev = [
    "build>=1.2",
    "hatchling>=1.26,<2",
    "mypy>=1.15",
    "packaging>=25",
    "pre-commit>=4.6",
    "pytest>=9.0.3",
    "pytest-cov>=6",
    "pytest-xdist>=3.8.0",
    "pytest-split==0.11.0",
    "pytest-timeout>=2.3.1,<3",
    "ruff>=0.11",
    "tomlkit>=0.13",
    "twine>=6",
    "onlyalpha-test-plugin",
    "onlyalpha-test-factor-provider",
    "onlyalpha-plugin-operators",
    "onlyalpha-plugin-indicators",
    "onlyalpha-gateway-protocol",
    "onlyalpha-backend-algorithms",
    "onlyalpha-calculation-worker",
    "onlyalpha-authoring-execution-worker",
    "onlyalpha-runtime-generation-manager",
    "onlyalpha-agent-orchestrator",
    "onlyalpha-agent",
    "grpcio-tools==1.73.1",
    "types-grpcio==1.0.0.20250703",
    "types-protobuf==6.30.2.20250809",
    "import-linter>=2.13",
    "hypothesis>=6.165.5",
    "crosshair-tool>=0.0.109",
    "mutmut>=3.7.0",
    "coverage>=7.15.2",
]

[tool.uv.workspace]
members = [
    "plugs/onlyalpha-broker-virtual",
    "plugs/onlyalpha-plugin-generic-t0-cash",
    "plugs/onlyalpha-market-cn-ashare",
    "plugs/onlyalpha-market-crypto",
    "plugs/onlyalpha-data-source-tushare",
    "plugs/onlyalpha-data-source-binance",
    "plugs/onlyalpha-broker-binance",
    "packages/onlyalpha-indicators",
    "packages/onlyalpha-operators",
    "packages/backend/python/gateway_protocol",
    "packages/backend/python/algorithms",
    "packages/onlyalpha-calculation-worker",
    "packages/onlyalpha-authoring-execution-worker",
    "packages/onlyalpha-runtime-generation-manager",
    "packages/onlyalpha-agent-orchestrator",
    "packages/agent",
]

[build-system]
requires = ["hatchling>=1.26,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/onlyalpha"]

[tool.hatch.build.targets.wheel.force-include]
"database/postgres/migrations" = "onlyalpha/persistence/postgres/migrations"
"packages/backend/python/algorithms/sdk/onlyalpha/canonical.py" = "onlyalpha/canonical.py"
"packages/backend/python/algorithms/sdk/onlyalpha/calculation/definition.py" = "onlyalpha/calculation/definition.py"
"packages/backend/python/algorithms/sdk/onlyalpha/calculation/compatibility.py" = "onlyalpha/calculation/compatibility.py"
"packages/backend/python/algorithms/sdk/onlyalpha/calculation/graph.py" = "onlyalpha/calculation/graph.py"
"packages/backend/python/algorithms/sdk/onlyalpha/calculation/implementation.py" = "onlyalpha/calculation/implementation.py"
"packages/backend/python/algorithms/sdk/onlyalpha/calculation/decimal_execution.py" = "onlyalpha/calculation/decimal_execution.py"
"packages/backend/python/algorithms/sdk/onlyalpha/calculation/chart_decimal.py" = "onlyalpha/calculation/chart_decimal.py"
"packages/backend/python/algorithms/sdk/onlyalpha/calculation/chart_study.py" = "onlyalpha/calculation/chart_study.py"
"packages/backend/python/algorithms/sdk/onlyalpha/calculation/value_semantics.py" = "onlyalpha/calculation/value_semantics.py"
"packages/backend/python/algorithms/sdk/onlyalpha/algorithm/__init__.py" = "onlyalpha/algorithm/__init__.py"
"packages/backend/python/algorithms/sdk/onlyalpha/algorithm/batch.py" = "onlyalpha/algorithm/batch.py"
"packages/backend/python/algorithms/sdk/onlyalpha/algorithm/private_factor.py" = "onlyalpha/algorithm/private_factor.py"
"packages/backend/python/algorithms/sdk/onlyalpha/calculation/registry.py" = "onlyalpha/calculation/registry.py"
"packages/backend/python/algorithms/sdk/onlyalpha/quant_assets/private_factor_provider_snapshot.py" = "onlyalpha/quant_assets/private_factor_provider_snapshot.py"
"packages/backend/python/algorithms/sdk/onlyalpha/algorithm/codec.py" = "onlyalpha/algorithm/codec.py"
"packages/backend/python/algorithms/sdk/onlyalpha/algorithm/type_declaration.py" = "onlyalpha/algorithm/type_declaration.py"

[tool.hatch.build.targets.sdist.force-include]
"packages/backend/python/algorithms/sdk" = "packages/backend/python/algorithms/sdk"

[tool.hatch.build]
exclude = ["src/onlyalpha/_build_provenance.json", "src/onlyalpha/_build_provenance.sha256"]

[tool.hatch.build.hooks.custom]
path = "hatch_build.py"

[tool.ruff]
line-length = 120
target-version = "py312"
indent-width = 4
extend-exclude = [
    "packages/backend/python/gateway_protocol/src/onlyalpha_gateway_protocol/v1/*_pb2.py",
    "packages/backend/python/gateway_protocol/src/onlyalpha_gateway_protocol/v1/*_pb2.pyi",
    "packages/backend/python/gateway_protocol/src/onlyalpha_gateway_protocol/v1/*_pb2_grpc.py",
]

[tool.ruff.lint]
extend-select = ["I", "UP", "B"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = ["packages/backend/python/algorithms/sdk"]
files = [
    "src/onlyalpha",
    "packages/onlyalpha-indicators/src/onlyalpha_plugin_indicators",
    "packages/onlyalpha-operators/src/onlyalpha_plugin_operators",
    "packages/backend/python/algorithms/src/onlyalpha_backend_algorithms/targets",
    "packages/backend/python/gateway_protocol/src/onlyalpha_gateway_protocol",
    "packages/backend/python/algorithms/src/onlyalpha_backend_algorithms",
    "packages/onlyalpha-calculation-worker/src/onlyalpha_calculation_worker",
    "packages/onlyalpha-authoring-execution-worker/src/onlyalpha_authoring_execution_worker",
    "packages/onlyalpha-runtime-generation-manager/src/onlyalpha_runtime_generation_manager",
    "packages/onlyalpha-agent-orchestrator/src/onlyalpha_agent_orchestrator",
    "plugs/onlyalpha-market-crypto/src/onlyalpha_market_crypto/spot",
    "plugs/onlyalpha-market-crypto/src/onlyalpha_market_crypto/derivatives",
    "plugs/onlyalpha-data-source-binance/src/onlyalpha_plugin_binance",
]

[[tool.mypy.overrides]]
module = ["onlyalpha_gateway_protocol.v1.*"]
ignore_errors = true

[tool.uv.sources]
onlyalpha-test-plugin = { path = "test-data/external_plugins/onlyalpha_test_plugin", editable = true }
onlyalpha-test-factor-provider = { path = "test-data/runtime_factor_provider", editable = true }
onlyalpha-plugin-operators = { workspace = true }
onlyalpha-plugin-indicators = { workspace = true }
onlyalpha-gateway-protocol = { workspace = true }
onlyalpha-backend-algorithms = { workspace = true }
onlyalpha-calculation-worker = { workspace = true }
onlyalpha-authoring-execution-worker = { workspace = true }
onlyalpha-runtime-generation-manager = { workspace = true }
onlyalpha-agent-orchestrator = { workspace = true }
onlyalpha-agent = { workspace = true }
onlyalpha-market-crypto = { workspace = true }
onlyalpha-data-source-binance = { workspace = true }
onlyalpha-broker-binance = { workspace = true }

[tool.pytest.ini_options]
consider_namespace_packages = true
testpaths = [
    "scripts/tests",
    "plugs/onlyalpha-broker-virtual/tests",
    "plugs/onlyalpha-plugin-generic-t0-cash/tests",
    "plugs/onlyalpha-market-cn-ashare/tests",
    "plugs/onlyalpha-market-crypto/tests",
    "plugs/onlyalpha-data-source-binance/tests",
    "plugs/onlyalpha-broker-binance/tests",
    "plugs/onlyalpha-data-source-tushare/tests",
    "packages/onlyalpha-indicators/tests",
    "packages/onlyalpha-operators/tests",
    "packages/backend/python/algorithms/tests",
    "packages/backend/tests/transport",
    "packages/backend/python/gateway_protocol/tests",
    "packages/onlyalpha-calculation-worker/tests",
    "packages/onlyalpha-authoring-execution-worker/tests",
    "packages/onlyalpha-runtime-generation-manager/tests",
    "packages/backend/tests/application",
    "packages/onlyalpha-agent-orchestrator/tests",
    "packages/agent/tests",
]
markers = [
    "unit: isolated unit test",
    "contract: public API or plugin contract test",
    "architecture: dependency, ownership, authority, and forbidden-pattern gate",
    "integration: local integration test",
    "scenario: Engine scenario test",
    "conformance: market conformance test",
    "recovery: checkpoint, restart, fault injection, or projection recovery test",
    "sim_recovery: SIM durable product and new-process recovery certification test",
    "external: external service integration test",
    "exhaustive: combinatorial, 100-run, or full fault-matrix verification",
    "miniqmt: frozen MiniQMT historical-data provenance conformance",
    "requires_network: requires network access",
    "requires_tushare: requires Tushare token",
    "requires_binance_public: requires Binance public API",
    "requires_broker_account: may access or submit to a real broker account",
    "windows: Windows-only test",
    "slow: slow test",
    "postgres: requires the pinned real PostgreSQL integration service",
    "clickhouse: requires the supported real ClickHouse integration service",
    "database_acceptance: requires the combined PostgreSQL and ClickHouse acceptance topology",
    "historical_git: requires immutable Git history and may only run in an explicitly history-capable verification lane",
]

[tool.importlinter]
root_package = "onlyalpha"
include_external_packages = true
exclude_type_checking_imports = true


[[tool.importlinter.contracts]]
id = "domain-boundary"
name = "Domain must not depend on orchestration or infrastructure"
type = "forbidden"

source_modules = [
    "onlyalpha.domain",
]

forbidden_modules = [
    "onlyalpha.application",
    "onlyalpha.engine",
    "onlyalpha.broker",
    "onlyalpha.account",
    "onlyalpha.analytics",
    "onlyalpha.artifact",
    "onlyalpha.cache",
    "onlyalpha.cluster",
    "onlyalpha.collector",
    "onlyalpha.config",
    "onlyalpha.data",
]


[[tool.importlinter.contracts]]
id = "domain-acyclic"
name = "Domain modules must remain acyclic"
type = "acyclic_siblings"

ancestors = [
    "onlyalpha.domain",
]

depth = 3

[[tool.importlinter.contracts]]
id = "core-plugin-boundary"
name = "Core must not import concrete plugin implementations"
type = "forbidden"
source_modules = ["onlyalpha"]
forbidden_modules = [
    "onlyalpha_plugin_broker_virtual",
    "onlyalpha_plugin_tushare",
    "onlyalpha_plugin_cn_ashare",
    "onlyalpha_plugin_generic_t0_cash",
    "onlyalpha_market_crypto",
    "onlyalpha_broker_binance",
    "onlyalpha_plugin_binance",
    "onlyalpha_plugin_indicators",
    "onlyalpha_plugin_operators",
    "onlyalpha_backend_algorithms.targets",
    "onlyalpha_test_factor_provider",
]

[tool.coverage.run]
branch = true
source = ["src/onlyalpha"]
patch = ["subprocess", "_exit"]
relative_files = true

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 82

[tool.coverage.json]
output = "test-results/coverage/coverage.json"

[tool.coverage.xml]
output = "test-results/coverage/coverage.xml"

[tool.mutmut]
source_paths = ["src/onlyalpha"]
only_mutate = ["src/onlyalpha/domain/value.py"]
also_copy = ["tests/property", "tests/domain/conformance"]
pytest_add_cli_args = ["-q", "--tb=short", "--maxfail=1"]
pytest_add_cli_args_test_selection = [
    "tests/property/test_domain_properties.py",
    "tests/domain/conformance",
    "-k",
    "financial_value_types or precision_and_increment",
]
