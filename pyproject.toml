[project]
name = "onlyalpha"
version = "0.9.8"
description = "A modular, deterministic quantitative trading system skeleton"
readme = "README.md"
requires-python = ">=3.12.0, <3.13.0"
dependencies = [
    "pyarrow>=21.0.0",
    "psycopg[binary]>=3.2,<4",
    "pyyaml>=6.0.2",
    "tzdata>=2025.2; sys_platform == 'win32'",
]

[dependency-groups]
compose-acceptance = [
    "hypothesis>=6.165.5",
    "pytest>=9.0.3",
    "pytest-benchmark>=5.2.3",
    "pytest-xdist>=3.8.0",
]
dev = [
    "build>=1.2",
    "mypy>=1.15",
    "packaging>=25",
    "pre-commit>=4.6",
    "pytest>=9.0.3",
    "pytest-cov>=6",
    "pytest-xdist>=3.8.0",
    "ruff>=0.11",
    "tomlkit>=0.13",
    "twine>=6",
    "onlyalpha-test-plugin",
    "onlyalpha-plugin-indicators",
    "onlyalpha-plugin-factors",
    "onlyalpha-plugin-targets",
    "onlyalpha-api",
    "onlyalpha-client",
    "onlyalpha-gateway-protocol",
    "grpcio-tools==1.73.1",
    "types-grpcio==1.0.0.20250703",
    "types-protobuf==6.30.2.20250809",
    "import-linter>=2.13",
    "hypothesis>=6.165.5",
    "crosshair-tool>=0.0.109",
    "mutmut>=3.7.0",
    "coverage>=7.15.2",
    "pytest-benchmark>=5.2.3",
]

[project.scripts]
onlyalpha = "onlyalpha.cli:main"
onlyalpha-research-worker = "onlyalpha.research.worker_main:main"

[tool.uv.workspace]
members = [
    "packages/fake/onlyalpha-plugin-broker-virtual",
    "packages/market/onlyalpha-market-generic-t0-cash",
    "packages/market/onlyalpha-market-cn-ashare",
    "packages/market/onlyalpha-market-binance-spot",
    "packages/provider/onlyalpha-plugin-tushare",
    "packages/provider/onlyalpha-plugin-binance",
    "packages/provider/onlyalpha-plugin-miniqmt",
    "packages/indicator/onlyalpha-plugin-indicators",
    "packages/factor/onlyalpha-plugin-factors",
    "packages/target/onlyalpha-plugin-targets",
    "packages/api/onlyalpha-api",
    "packages/client/onlyalpha-client",
    "packages/protocol/onlyalpha-gateway-protocol",
]

[build-system]
requires = ["hatchling>=1.26,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/onlyalpha"]

[tool.ruff]
line-length = 120
target-version = "py312"
indent-width = 4
extend-exclude = [
    "packages/protocol/onlyalpha-gateway-protocol/src/onlyalpha_gateway_protocol/v1/*_pb2.py",
    "packages/protocol/onlyalpha-gateway-protocol/src/onlyalpha_gateway_protocol/v1/*_pb2.pyi",
    "packages/protocol/onlyalpha-gateway-protocol/src/onlyalpha_gateway_protocol/v1/*_pb2_grpc.py",
]

[tool.ruff.lint]
extend-select = ["I", "UP", "B"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
strict = true
files = [
    "src/onlyalpha",
    "packages/indicator/onlyalpha-plugin-indicators/src/onlyalpha_plugin_indicators",
    "packages/factor/onlyalpha-plugin-factors/src/onlyalpha_plugin_factors",
    "packages/target/onlyalpha-plugin-targets/src/onlyalpha_plugin_targets",
    "packages/api/onlyalpha-api/src/onlyalpha_api",
    "packages/client/onlyalpha-client/src/onlyalpha_client",
    "packages/protocol/onlyalpha-gateway-protocol/src/onlyalpha_gateway_protocol",
    "packages/market/onlyalpha-market-binance-spot/src/onlyalpha_market_binance_spot",
    "packages/provider/onlyalpha-plugin-binance/src/onlyalpha_plugin_binance",
]

[[tool.mypy.overrides]]
module = ["onlyalpha_gateway_protocol.v1.*"]
ignore_errors = true

[tool.uv.sources]
onlyalpha-test-plugin = { path = "tests/fixtures/external_plugins/onlyalpha_test_plugin", editable = true }
onlyalpha-plugin-indicators = { workspace = true }
onlyalpha-plugin-factors = { workspace = true }
onlyalpha-plugin-targets = { workspace = true }
onlyalpha-api = { workspace = true }
onlyalpha-client = { workspace = true }
onlyalpha-gateway-protocol = { workspace = true }
onlyalpha-market-binance-spot = { workspace = true }
onlyalpha-plugin-binance = { workspace = true }

[tool.pytest.ini_options]
testpaths = [
    "tests",
    "packages/fake/onlyalpha-plugin-broker-virtual/tests",
    "packages/market/onlyalpha-market-generic-t0-cash/tests",
    "packages/market/onlyalpha-market-cn-ashare/tests",
    "packages/market/onlyalpha-market-binance-spot/tests",
    "packages/provider/onlyalpha-plugin-binance/tests",
    "packages/provider/onlyalpha-plugin-tushare/tests",
    "packages/provider/onlyalpha-plugin-miniqmt/tests",
    "packages/indicator/onlyalpha-plugin-indicators/tests",
    "packages/factor/onlyalpha-plugin-factors/tests",
    "packages/target/onlyalpha-plugin-targets/tests",
    "packages/api/onlyalpha-api/tests",
    "packages/client/onlyalpha-client/tests",
    "packages/protocol/onlyalpha-gateway-protocol/tests",
]
markers = [
    "unit: isolated unit test",
    "contract: public API or plugin contract test",
    "architecture: dependency, ownership, authority, and forbidden-pattern gate",
    "integration: local integration test",
    "scenario: Engine scenario test",
    "conformance: market conformance test",
    "recovery: checkpoint, restart, fault injection, or projection recovery test",
    "sim_recovery: SIM durable product and new-process recovery certification test",
    "external: external service integration test",
    "performance: explicit performance or scale test",
    "exhaustive: combinatorial, 100-run, or full fault-matrix verification",
    "miniqmt: MiniQMT adapter or environment test",
    "requires_network: requires network access",
    "requires_tushare: requires Tushare token",
    "requires_binance_public: requires Binance public API",
    "requires_local_qmt: requires local MiniQMT client",
    "requires_broker_account: may access or submit to a real broker account",
    "windows: Windows-only test",
    "slow: slow test",
    "postgres: requires the pinned real PostgreSQL integration service",
    "clickhouse: requires the supported real ClickHouse integration service",
    "p9_3_real_database: requires the combined P9.3 PostgreSQL and ClickHouse acceptance topology",
    "historical_git: requires immutable Git history and may only run in an explicitly history-capable verification lane",
]

[tool.importlinter]
root_package = "onlyalpha"
include_external_packages = true
exclude_type_checking_imports = true


[[tool.importlinter.contracts]]
id = "domain-boundary"
name = "Domain must not depend on orchestration or infrastructure"
type = "forbidden"

source_modules = [
    "onlyalpha.domain",
]

forbidden_modules = [
    "onlyalpha.application",
    "onlyalpha.engine",
    "onlyalpha.broker",
    "onlyalpha.account",
    "onlyalpha.analytics",
    "onlyalpha.artifact",
    "onlyalpha.cache",
    "onlyalpha.cluster",
    "onlyalpha.collector",
    "onlyalpha.config",
    "onlyalpha.data",
]


[[tool.importlinter.contracts]]
id = "domain-acyclic"
name = "Domain modules must remain acyclic"
type = "acyclic_siblings"

ancestors = [
    "onlyalpha.domain",
]

depth = 3

[[tool.importlinter.contracts]]
id = "core-plugin-boundary"
name = "Core must not import concrete plugin implementations"
type = "forbidden"
source_modules = ["onlyalpha"]
forbidden_modules = [
    "onlyalpha_plugin_broker_virtual",
    "onlyalpha_plugin_miniqmt",
    "onlyalpha_plugin_tushare",
    "onlyalpha_market_cn_ashare",
    "onlyalpha_market_generic_t0_cash",
    "onlyalpha_market_binance_spot",
    "onlyalpha_plugin_binance",
    "onlyalpha_plugin_indicators",
    "onlyalpha_plugin_factors",
    "onlyalpha_plugin_targets",
]

[tool.coverage.run]
branch = true
source = ["src/onlyalpha"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 82

[tool.coverage.json]
output = "test-results/coverage/coverage.json"

[tool.coverage.xml]
output = "test-results/coverage/coverage.xml"

[tool.mutmut]
source_paths = ["src/onlyalpha"]
only_mutate = ["src/onlyalpha/domain/value.py"]
also_copy = ["tests/property", "tests/domain_conformance"]
pytest_add_cli_args = ["-q", "--tb=short", "--maxfail=1"]
pytest_add_cli_args_test_selection = [
    "tests/property/test_domain_properties.py",
    "tests/domain_conformance",
    "-k",
    "financial_value_types or precision_and_increment",
]
