name: ${ONLYALPHA_COMPOSE_NAMESPACE:-onlyalpha-dev}

services:
  postgres:
    image: postgres:18.6@sha256:4ef4dbc939d61acea57712655ddb4b4ab27419c913f94cca0cd57cb3ea3c2280
    environment:
      POSTGRES_USER: onlyalpha
      POSTGRES_PASSWORD: onlyalpha
      POSTGRES_DB: ${ONLYALPHA_POSTGRES_DB:-onlyalpha}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U onlyalpha -d ${ONLYALPHA_POSTGRES_DB:-onlyalpha}"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s
    volumes:
      - postgres-data:/var/lib/postgresql
    networks: [database]

  clickhouse:
    image: clickhouse/clickhouse-server:26.3@sha256:ad76fddfd4f1787b03cdc0045e0ccdf23a7508e1bc0301295f024389de323568
    environment:
      CLICKHOUSE_USER: onlyalpha
      CLICKHOUSE_PASSWORD: onlyalpha
      CLICKHOUSE_DB: ${ONLYALPHA_CLICKHOUSE_DATABASE:-onlyalpha}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    healthcheck:
      test: ["CMD-SHELL", "clickhouse-client --user onlyalpha --password onlyalpha --query 'SELECT 1'"]
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 15s
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    volumes:
      - clickhouse-data:/var/lib/clickhouse
    networks: [database]

  bootstrap:
    profiles: [integration, web-e2e]
    image: onlyalpha-runtime:dev
    build:
      context: ..
      dockerfile: deploy/Dockerfile.dev
      target: runtime
    command: ["python", "scripts/bootstrap.py"]
    environment:
      ONLYALPHA_POSTGRES_DSN: postgresql://onlyalpha:onlyalpha@postgres:5432/${ONLYALPHA_POSTGRES_DB:-onlyalpha}
      ONLYALPHA_CLICKHOUSE_URL: http://clickhouse:8123
      ONLYALPHA_CLICKHOUSE_USER: onlyalpha
      ONLYALPHA_CLICKHOUSE_PASSWORD: onlyalpha
      ONLYALPHA_CLICKHOUSE_DATABASE: ${ONLYALPHA_CLICKHOUSE_DATABASE:-onlyalpha}
      ONLYALPHA_CLICKHOUSE_STORAGE_POLICY: default
      ONLYALPHA_USER_DATA_ROOT: /var/lib/onlyalpha
      # Canonical dev Agent Provider model identity. These MUST equal the production
      # semantic bundle invocation binding so the agent INTEGRATION_REVISION compose
      # binding check admits the revision provisioned below. The provider base URL and
      # credential defaults in scripts/bootstrap.py already target agent-provider-fixture.
      ONLYALPHA_AGENT_PROVIDER_MODEL_ID: onlyalpha-research-v1
      ONLYALPHA_AGENT_PROVIDER_MODEL_VERSION: "2026-09-01"
    depends_on:
      postgres:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
      agent-provider-fixture:
        condition: service_healthy
    volumes:
      - user-data:/var/lib/onlyalpha
    networks: [database]

  api:
    profiles: [integration, web-e2e]
    image: onlyalpha-runtime:dev
    build:
      context: ..
      dockerfile: deploy/Dockerfile.dev
      target: runtime
    command:
      [
        "onlyalpha-http-server",
        "--user-data-root",
        "/var/lib/onlyalpha",
        "--agent-node-url",
        "http://agent:8010",
        "--agent-control-token-file",
        "/var/lib/onlyalpha/secrets/agent-control-token",
        "--agent-runtime-token-file",
        "/var/lib/onlyalpha/secrets/agent-runtime-token",
        "--host",
        "0.0.0.0",
        "--port",
        "8000",
      ]
    environment:
      ONLYALPHA_POSTGRES_DSN: postgresql://onlyalpha:onlyalpha@postgres:5432/${ONLYALPHA_POSTGRES_DB:-onlyalpha}
      ONLYALPHA_CLICKHOUSE_URL: http://clickhouse:8123
      ONLYALPHA_CLICKHOUSE_USER: onlyalpha
      ONLYALPHA_CLICKHOUSE_PASSWORD: onlyalpha
      ONLYALPHA_CLICKHOUSE_DATABASE: ${ONLYALPHA_CLICKHOUSE_DATABASE:-onlyalpha}
      ONLYALPHA_CLICKHOUSE_STORAGE_POLICY: default
      SSL_CERT_FILE: ${ONLYALPHA_SSL_CERT_FILE:-/etc/ssl/certs/ca-certificates.crt}
      HTTP_PROXY: ${ONLYALPHA_HTTP_PROXY:-}
      HTTPS_PROXY: ${ONLYALPHA_HTTPS_PROXY:-}
      http_proxy: ${ONLYALPHA_HTTP_PROXY:-}
      https_proxy: ${ONLYALPHA_HTTPS_PROXY:-}
      NO_PROXY: ${ONLYALPHA_NO_PROXY:-localhost,127.0.0.1,postgres,clickhouse,api,web,agent,agent-provider-fixture,binance-probe-fixture}
      no_proxy: ${ONLYALPHA_NO_PROXY:-localhost,127.0.0.1,postgres,clickhouse,api,web,agent,agent-provider-fixture,binance-probe-fixture}
    depends_on:
      bootstrap:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:${ONLYALPHA_HTTP_PORT:-8000}:8000"
    volumes:
      - user-data:/var/lib/onlyalpha
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/live')"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 15s
    networks: [database, application]

  market-data-bootstrap:
    profiles: [integration, web-e2e]
    image: onlyalpha-runtime:dev
    build:
      context: ..
      dockerfile: deploy/Dockerfile.dev
      target: runtime
    command: ["python", "-m", "scripts.provision_dev_market_data"]
    environment:
      ONLYALPHA_PRODUCT_API_URL: http://api:8000
    depends_on:
      api:
        condition: service_healthy
    # HTTP-only startup client: no database network, credentials or shared volumes.
    networks: [application]

  web:
    profiles: [integration, web-e2e]
    image: onlyalpha-web:dev
    build:
      context: ..
      dockerfile: deploy/Dockerfile.dev
      target: web
    command: ["npm", "run", "dev", "--", "--host", "0.0.0.0"]
    environment:
      ONLYALPHA_WEB_API_TARGET: http://api:8000
    depends_on:
      api:
        condition: service_healthy
      market-data-bootstrap:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:${ONLYALPHA_WEB_PORT:-5173}:5173"
    healthcheck:
      test:
        ["CMD", "node", "-e", "fetch('http://127.0.0.1:5173/').then(r => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s
    networks: [application]

  research-worker:
    profiles: [integration, web-e2e]
    image: onlyalpha-runtime:dev
    build:
      context: ..
      dockerfile: deploy/Dockerfile.dev
      target: runtime
    command: ["onlyalpha-research-worker", "--user-data-root", "/var/lib/onlyalpha"]
    environment:
      ONLYALPHA_POSTGRES_DSN: postgresql://onlyalpha:onlyalpha@postgres:5432/${ONLYALPHA_POSTGRES_DB:-onlyalpha}
    depends_on:
      bootstrap:
        condition: service_completed_successfully
    volumes:
      - user-data:/var/lib/onlyalpha
    networks: [database]

  backtest-worker:
    profiles: [integration, web-e2e]
    image: onlyalpha-runtime:dev
    build:
      context: ..
      dockerfile: deploy/Dockerfile.dev
      target: runtime
    command: ["onlyalpha-backtest-worker", "--user-data-root", "/var/lib/onlyalpha"]
    environment:
      ONLYALPHA_POSTGRES_DSN: postgresql://onlyalpha:onlyalpha@postgres:5432/${ONLYALPHA_POSTGRES_DB:-onlyalpha}
    depends_on:
      bootstrap:
        condition: service_completed_successfully
    volumes:
      - user-data:/var/lib/onlyalpha
    networks: [database]

  agent:
    profiles: [integration, web-e2e]
    image: onlyalpha-runtime:dev
    build:
      context: ..
      dockerfile: deploy/Dockerfile.dev
      target: runtime
    entrypoint: ["onlyalpha-agent"]
    command:
      [
        "serve",
        "--model-configuration-mode",
        "INTEGRATION_REVISION",
        "--durable-root",
        "/var/lib/onlyalpha-agent",
        "--coordination-root",
        "/var/run/onlyalpha-agent",
        "--product-api-url",
        "http://api:8000",
        "--product-api-contract",
        "/workspace/contracts/product-api/v2/openapi.json",
        "--product-token-file",
        "/var/lib/onlyalpha/secrets/agent-product-token",
        "--integration-runtime-authority-url",
        "http://api:8000/internal/v1/agent-provider-runtime",
        "--integration-runtime-authority-token-file",
        "/var/lib/onlyalpha/secrets/agent-runtime-token",
        "--model-profile-file",
        "/var/lib/onlyalpha/agent/model-profile.json",
        # Explicit dev-only exception: the runtime authority is reached over plain HTTP
        # on the internal compose network. Production omits this flag and serves HTTPS.
        "--allow-insecure-runtime-authority-transport",
        "--control-token-file",
        "/var/lib/onlyalpha/secrets/agent-control-token",
        "--host",
        "0.0.0.0",
        "--port",
        "8010",
      ]
    depends_on:
      api:
        condition: service_healthy
    volumes:
      - agent-state:/var/lib/onlyalpha-agent
      - agent-locks:/var/run/onlyalpha-agent
      - user-data:/var/lib/onlyalpha:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8010/internal/v1/healthz')"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s
    networks: [application]

  test:
    image: onlyalpha-${ONLYALPHA_TEST_BUILD_TARGET:-test}:dev
    profiles: [test]
    build:
      context: ..
      dockerfile: deploy/Dockerfile.dev
      target: ${ONLYALPHA_TEST_BUILD_TARGET:-test}
    entrypoint: ["python", "scripts/compose_test.py"]
    command: ["python", "scripts/test_suite.py", "architecture"]
    environment:
      ONLYALPHA_POSTGRES_DSN: postgresql://onlyalpha:onlyalpha@postgres:5432/${ONLYALPHA_POSTGRES_DB:-onlyalpha}_test
      ONLYALPHA_TEST_CLICKHOUSE_URL: http://clickhouse:8123
      ONLYALPHA_TEST_CLICKHOUSE_USER: onlyalpha
      ONLYALPHA_TEST_CLICKHOUSE_PASSWORD: onlyalpha
      ONLYALPHA_TEST_CLICKHOUSE_STORAGE_POLICY: default
      ONLYALPHA_POSTGRES_CLIENT_BIN_DIR: /usr/lib/postgresql/18/bin
    volumes:
      - type: bind
        source: ../.git
        target: /workspace/.git
        read_only: true
    depends_on:
      postgres:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
    networks: [database]

  # Persistent, source-mounted local verification. Select this service explicitly;
  # never start the business/bootstrap services just to run hermetic tests.
  validation:
    profiles: [test]
    image: onlyalpha-browser-test:dev
    build:
      context: ..
      dockerfile: deploy/Dockerfile.dev
      target: browser-test
    init: true
    command: ["python", "-c", "import signal; signal.pause()"]
    environment:
      CI: "1"
      ONLYALPHA_POSTGRES_DSN: postgresql://onlyalpha:onlyalpha@postgres:5432/onlyalpha_dev_validation_test
      ONLYALPHA_TEST_CLICKHOUSE_URL: http://clickhouse:8123
      ONLYALPHA_TEST_CLICKHOUSE_USER: onlyalpha
      ONLYALPHA_TEST_CLICKHOUSE_PASSWORD: onlyalpha
      ONLYALPHA_TEST_CLICKHOUSE_STORAGE_POLICY: default
      HTTP_PROXY: ""
      HTTPS_PROXY: ""
      ALL_PROXY: ""
      http_proxy: ""
      https_proxy: ""
      all_proxy: ""
      NO_PROXY: localhost,127.0.0.1,postgres,clickhouse
      no_proxy: localhost,127.0.0.1,postgres,clickhouse
    volumes:
      - type: bind
        source: ../.test-cache/dev-source-cut
        target: /workspace
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ..
        target: /onlyalpha-current-source
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ../test-results
        target: /workspace/test-results
        bind:
          create_host_path: false
      - type: bind
        source: ../.test-cache/dev-tool-output/tsconfig.app.tsbuildinfo
        target: /workspace/packages/onlyalpha-web-console/tsconfig.app.tsbuildinfo
        bind:
          create_host_path: false
      - type: bind
        source: ../.test-cache/dev-tool-output/tsconfig.node.tsbuildinfo
        target: /workspace/packages/onlyalpha-web-console/tsconfig.node.tsbuildinfo
        bind:
          create_host_path: false
      # Native read-only image mounts mask host dependency directories without
      # creating cache volumes that would retain stale dependencies after rebuild.
      - type: image
        source: ${ONLYALPHA_DEV_TOOL_IMAGE_ID:-onlyalpha-browser-test:dev}
        target: /workspace/.venv
        read_only: true
        image:
          subpath: workspace/.venv
      - type: image
        source: ${ONLYALPHA_DEV_TOOL_IMAGE_ID:-onlyalpha-browser-test:dev}
        target: /workspace/packages/onlyalpha-web-console/node_modules
        read_only: true
        image:
          subpath: workspace/packages/onlyalpha-web-console/node_modules
      - type: image
        source: ${ONLYALPHA_DEV_TOOL_IMAGE_ID:-onlyalpha-browser-test:dev}
        target: /usr/local/rustup
        read_only: true
        image:
          subpath: usr/local/rustup
      - type: image
        source: ${ONLYALPHA_DEV_TOOL_IMAGE_ID:-onlyalpha-browser-test:dev}
        target: /usr/local/cargo
        read_only: true
        image:
          subpath: usr/local/cargo
    tmpfs:
      - /workspace/.ruff_cache:uid=10001,gid=10001
      - /workspace/.mypy_cache:uid=10001,gid=10001
      - /workspace/.pytest_cache:uid=10001,gid=10001
      - /workspace/.hypothesis:uid=10001,gid=10001
      - /workspace/.test-cache:uid=10001,gid=10001
      - /workspace/build:uid=10001,gid=10001
      - /workspace/packages/onlyalpha-web-console/dist:uid=10001,gid=10001
      - /workspace/packages/onlyalpha-web-console/node_modules/.vite:uid=10001,gid=10001
      - /workspace/packages/onlyalpha-web-console/node_modules/.vite-temp:uid=10001,gid=10001
    depends_on:
      postgres:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
    networks: [database]

  web-e2e-fixture:
    image: onlyalpha-test:dev
    profiles: [web-e2e]
    build:
      context: ..
      dockerfile: deploy/Dockerfile.dev
      target: test
    entrypoint: ["python", "scripts/prepare_web_e2e.py"]
    environment:
      ONLYALPHA_USER_DATA_ROOT: /var/lib/onlyalpha
    depends_on:
      bootstrap:
        condition: service_completed_successfully
    volumes:
      - user-data:/var/lib/onlyalpha
    networks: [database]

  binance-probe-fixture:
    image: onlyalpha-runtime:dev
    profiles: [web-e2e]
    build:
      context: ..
      dockerfile: deploy/Dockerfile.dev
      target: runtime
    command:
      [
        "python",
        "-m",
        "tests.runtime_support.binance_spot_probe_fixture",
        "--certificate-directory",
        "/var/lib/onlyalpha/probe-fixture",
      ]
    depends_on:
      bootstrap:
        condition: service_completed_successfully
    volumes:
      - user-data:/var/lib/onlyalpha
    healthcheck:
      test:
        ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health')"]
      interval: 2s
      timeout: 2s
      retries: 20
      start_period: 2s
    networks:
      application:
        aliases: [api.binance.com, stream.binance.com, data-api.binance.vision, data-stream.binance.vision]

  agent-provider-fixture:
    profiles: [integration, web-e2e]
    image: onlyalpha-runtime:dev
    build:
      context: ..
      dockerfile: deploy/Dockerfile.dev
      target: runtime
    command:
      ["python", "-m", "tests.runtime_support.openai_compatible_provider_fixture", "--host", "0.0.0.0", "--port", "8080"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health')"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s
    networks: [database, application]

  # The one ordinary dev application: installed uv dependencies, Shipping Web and
  # canonical API, over the EXISTING dev deployment. No initialization dependency.
  dev:
    profiles: [dev]
    image: ${ONLYALPHA_DEV_TOOL_IMAGE_ID:-onlyalpha-browser-test:dev}
    init: true
    command: ["python", "-m", "scripts.dev", "inside"]
    environment:
      ONLYALPHA_POSTGRES_DSN: postgresql://onlyalpha:onlyalpha@postgres:5432/onlyalpha
      ONLYALPHA_CLICKHOUSE_URL: http://clickhouse:8123
      ONLYALPHA_CLICKHOUSE_USER: onlyalpha
      ONLYALPHA_CLICKHOUSE_PASSWORD: onlyalpha
      ONLYALPHA_CLICKHOUSE_DATABASE: onlyalpha
      ONLYALPHA_CLICKHOUSE_STORAGE_POLICY: default
      VITE_ONLYALPHA_LOCAL_SESSION: "true"
      HTTP_PROXY: ""
      HTTPS_PROXY: ""
      ALL_PROXY: ""
      http_proxy: ""
      https_proxy: ""
      all_proxy: ""
      NO_PROXY: localhost,127.0.0.1,postgres,clickhouse
      no_proxy: localhost,127.0.0.1,postgres,clickhouse
    ports: ["127.0.0.1:5173:5173"]
    volumes:
      - type: bind
        source: ../.test-cache/dev-product-source
        target: /workspace
        read_only: true
        bind:
          create_host_path: false
      - type: image
        source: ${ONLYALPHA_DEV_TOOL_IMAGE_ID:-onlyalpha-browser-test:dev}
        target: /workspace/.venv
        read_only: true
        image:
          subpath: workspace/.venv
      - type: image
        source: ${ONLYALPHA_DEV_TOOL_IMAGE_ID:-onlyalpha-browser-test:dev}
        target: /workspace/packages/onlyalpha-web-console/node_modules
        read_only: true
        image:
          subpath: workspace/packages/onlyalpha-web-console/node_modules
      - type: volume
        source: user-data
        target: /var/lib/onlyalpha
        volume:
          nocopy: true
    tmpfs:
      - /tmp/onlyalpha-web:uid=10001,gid=10001
      - /workspace/packages/onlyalpha-web-console/node_modules/.vite-temp:uid=10001,gid=10001
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5173/health/ready')"]
      interval: 5s
      timeout: 5s
      retries: 6
      start_period: 15s
    networks: [database, application]

  playwright:
    image: onlyalpha-playwright:dev
    profiles: [web-e2e]
    build:
      context: ..
      dockerfile: deploy/Dockerfile.dev
      target: playwright
    init: true
    command: ["npx", "playwright", "test", "--config=playwright.compose.config.ts"]
    environment:
      CI: "1"
      PLAYWRIGHT_BASE_URL: http://web:5173
    depends_on:
      web:
        condition: service_healthy
      web-e2e-fixture:
        condition: service_completed_successfully
      binance-probe-fixture:
        condition: service_healthy
    volumes:
      - "${ONLYALPHA_WEB_E2E_ARTIFACTS_DIR:-../test-results/web-e2e}:/workspace/packages/onlyalpha-web-console/test-results"
    networks: [application]

networks:
  database:
    name: ${ONLYALPHA_COMPOSE_NAMESPACE:-onlyalpha-dev}-database
    internal: true
  application:
    name: ${ONLYALPHA_COMPOSE_NAMESPACE:-onlyalpha-dev}-application

volumes:
  postgres-data:
    name: ${ONLYALPHA_COMPOSE_NAMESPACE:-onlyalpha-dev}-postgres-data
  clickhouse-data:
    name: ${ONLYALPHA_COMPOSE_NAMESPACE:-onlyalpha-dev}-clickhouse-data
  user-data:
    name: ${ONLYALPHA_COMPOSE_NAMESPACE:-onlyalpha-dev}-user-data
    # Ordinary dev starts only against an existing store. The runner selects the
    # external reference to prevent Compose volume reconciliation/recreation.
    external: ${ONLYALPHA_DEV_EXISTING_USER_DATA:-false}
  agent-state:
    name: ${ONLYALPHA_COMPOSE_NAMESPACE:-onlyalpha-dev}-agent-state
  agent-locks:
    name: ${ONLYALPHA_COMPOSE_NAMESPACE:-onlyalpha-dev}-agent-locks
