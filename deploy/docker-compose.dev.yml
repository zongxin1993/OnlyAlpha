name: ${ONLYALPHA_COMPOSE_NAMESPACE:-onlyalpha-dev}

services:
  postgres:
    image: postgres:18.6@sha256:4ef4dbc939d61acea57712655ddb4b4ab27419c913f94cca0cd57cb3ea3c2280
    environment:
      POSTGRES_USER: onlyalpha
      POSTGRES_PASSWORD: onlyalpha
      POSTGRES_DB: ${ONLYALPHA_POSTGRES_DB:-onlyalpha}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U onlyalpha -d ${ONLYALPHA_POSTGRES_DB:-onlyalpha}"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s
    volumes:
      - postgres-data:/var/lib/postgresql
    networks: [database]

  clickhouse:
    image: clickhouse/clickhouse-server:26.3@sha256:ad76fddfd4f1787b03cdc0045e0ccdf23a7508e1bc0301295f024389de323568
    environment:
      CLICKHOUSE_USER: onlyalpha
      CLICKHOUSE_PASSWORD: onlyalpha
      CLICKHOUSE_DB: ${ONLYALPHA_CLICKHOUSE_DATABASE:-onlyalpha}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    healthcheck:
      test: ["CMD-SHELL", "clickhouse-client --user onlyalpha --password onlyalpha --query 'SELECT 1'"]
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 15s
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    volumes:
      - clickhouse-data:/var/lib/clickhouse
    networks: [database]

  test:
    image: onlyalpha-${ONLYALPHA_TEST_BUILD_TARGET:-test}:dev
    profiles: [test]
    build:
      context: ..
      dockerfile: deploy/Dockerfile.dev
      target: ${ONLYALPHA_TEST_BUILD_TARGET:-test}
    entrypoint: ["python", "scripts/compose_test.py"]
    command: ["python", "scripts/test_suite.py", "architecture"]
    environment:
      ONLYALPHA_POSTGRES_DSN: postgresql://onlyalpha:onlyalpha@postgres:5432/${ONLYALPHA_POSTGRES_DB:-onlyalpha}_test
      ONLYALPHA_TEST_CLICKHOUSE_URL: http://clickhouse:8123
      ONLYALPHA_TEST_CLICKHOUSE_USER: onlyalpha
      ONLYALPHA_TEST_CLICKHOUSE_PASSWORD: onlyalpha
      ONLYALPHA_TEST_CLICKHOUSE_STORAGE_POLICY: default
      ONLYALPHA_POSTGRES_CLIENT_BIN_DIR: /usr/lib/postgresql/18/bin
    volumes:
      - type: bind
        source: ../.git
        target: /workspace/.git
        read_only: true
    depends_on:
      postgres:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
    networks: [database]

  # Persistent, source-mounted local verification. Select this service explicitly;
  # never start the business/bootstrap services just to run hermetic tests.
  validation:
    profiles: [test]
    image: onlyalpha-browser-test:dev
    build:
      context: ..
      dockerfile: deploy/Dockerfile.dev
      target: browser-test
    init: true
    command: ["python", "-c", "import signal; signal.pause()"]
    environment:
      CI: "1"
      ONLYALPHA_POSTGRES_DSN: postgresql://onlyalpha:onlyalpha@postgres:5432/onlyalpha_dev_validation_test
      ONLYALPHA_TEST_CLICKHOUSE_URL: http://clickhouse:8123
      ONLYALPHA_TEST_CLICKHOUSE_USER: onlyalpha
      ONLYALPHA_TEST_CLICKHOUSE_PASSWORD: onlyalpha
      ONLYALPHA_TEST_CLICKHOUSE_STORAGE_POLICY: default
      HTTP_PROXY: ""
      HTTPS_PROXY: ""
      ALL_PROXY: ""
      http_proxy: ""
      https_proxy: ""
      all_proxy: ""
      NO_PROXY: localhost,127.0.0.1,postgres,clickhouse
      no_proxy: localhost,127.0.0.1,postgres,clickhouse
    volumes:
      - type: bind
        source: ../.test-cache/dev-source-cut
        target: /workspace
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ..
        target: /onlyalpha-current-source
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ../test-results
        target: /workspace/test-results
        bind:
          create_host_path: false
      - type: bind
        source: ../.test-cache/dev-tool-output/tsconfig.app.tsbuildinfo
        target: /workspace/packages/frontend/tsconfig.app.tsbuildinfo
        bind:
          create_host_path: false
      - type: bind
        source: ../.test-cache/dev-tool-output/tsconfig.node.tsbuildinfo
        target: /workspace/packages/frontend/tsconfig.node.tsbuildinfo
        bind:
          create_host_path: false
      # Native read-only image mounts mask host dependency directories without
      # creating cache volumes that would retain stale dependencies after rebuild.
      - type: image
        source: ${ONLYALPHA_DEV_TOOL_IMAGE_ID:-onlyalpha-browser-test:dev}
        target: /workspace/.venv
        read_only: true
        image:
          subpath: workspace/.venv
      - type: image
        source: ${ONLYALPHA_DEV_TOOL_IMAGE_ID:-onlyalpha-browser-test:dev}
        target: /workspace/packages/frontend/node_modules
        read_only: true
        image:
          subpath: workspace/packages/frontend/node_modules
      - type: image
        source: ${ONLYALPHA_DEV_TOOL_IMAGE_ID:-onlyalpha-browser-test:dev}
        target: /usr/local/rustup
        read_only: true
        image:
          subpath: usr/local/rustup
      - type: image
        source: ${ONLYALPHA_DEV_TOOL_IMAGE_ID:-onlyalpha-browser-test:dev}
        target: /usr/local/cargo
        read_only: true
        image:
          subpath: usr/local/cargo
    tmpfs:
      - /workspace/.ruff_cache:uid=10001,gid=10001
      - /workspace/.mypy_cache:uid=10001,gid=10001
      - /workspace/.pytest_cache:uid=10001,gid=10001
      - /workspace/.hypothesis:uid=10001,gid=10001
      - /workspace/.test-cache:uid=10001,gid=10001
      - /workspace/build:uid=10001,gid=10001
      - /workspace/packages/frontend/dist:uid=10001,gid=10001
      - /workspace/packages/frontend/node_modules/.vite:uid=10001,gid=10001
      - /workspace/packages/frontend/node_modules/.vite-temp:uid=10001,gid=10001
    depends_on:
      postgres:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
    networks: [database]

  dev:
    profiles: [dev]
    # Source close may consume its own 10s before retained facts/owners drain.
    stop_grace_period: 60s
    image: ${ONLYALPHA_DEV_TOOL_IMAGE_ID:-onlyalpha-browser-test:dev}
    init: true
    command: ["python", "-m", "scripts.dev", "inside"]
    environment:
      ONLYALPHA_NATIVE_ARTIFACT_ROOT: ${ONLYALPHA_NATIVE_ARTIFACT_ROOT:-/workspace/test-results/native-workstation/unprepared}
      ONLYALPHA_POSTGRES_DSN: postgresql://onlyalpha:onlyalpha@postgres:5432/onlyalpha?sslmode=disable
      ONLYALPHA_CLICKHOUSE_URL: http://clickhouse:8123
      ONLYALPHA_CLICKHOUSE_USER: onlyalpha
      ONLYALPHA_CLICKHOUSE_PASSWORD: onlyalpha
      ONLYALPHA_CLICKHOUSE_DATABASE: onlyalpha
      ONLYALPHA_CLICKHOUSE_STORAGE_POLICY: default
      VITE_ONLYALPHA_LOCAL_SESSION: "true"
      HTTP_PROXY: ""
      HTTPS_PROXY: ""
      ALL_PROXY: ""
      http_proxy: ""
      https_proxy: ""
      all_proxy: ""
      NO_PROXY: localhost,127.0.0.1,postgres,clickhouse
      no_proxy: localhost,127.0.0.1,postgres,clickhouse
    ports: ["127.0.0.1:5173:5173", "127.0.0.1:5174:5174"]
    volumes:
      - type: bind
        source: ../.test-cache/dev-product-source
        target: /workspace
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${ONLYALPHA_NATIVE_ARTIFACT_SOURCE:-../test-results/native-workstation/unprepared}
        target: ${ONLYALPHA_NATIVE_ARTIFACT_ROOT:-/workspace/test-results/native-workstation/unprepared}
        read_only: true
        bind:
          create_host_path: false
      - type: image
        source: ${ONLYALPHA_DEV_TOOL_IMAGE_ID:-onlyalpha-browser-test:dev}
        target: /workspace/.venv
        read_only: true
        image:
          subpath: workspace/.venv
      - type: image
        source: ${ONLYALPHA_DEV_TOOL_IMAGE_ID:-onlyalpha-browser-test:dev}
        target: /workspace/packages/frontend/node_modules
        read_only: true
        image:
          subpath: workspace/packages/frontend/node_modules
      - type: volume
        source: agent-state
        target: /var/lib/onlyalpha-agent
        volume:
          nocopy: true
      - type: volume
        source: user-data
        target: /var/lib/onlyalpha
        volume:
          nocopy: true
    tmpfs:
      - /tmp/onlyalpha-web:uid=10001,gid=10001
      - /workspace/packages/frontend/node_modules/.vite-temp:uid=10001,gid=10001
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5173/health/ready')"]
      interval: 5s
      timeout: 5s
      retries: 6
      start_period: 15s
    networks: [database, application]

networks:
  database:
    name: ${ONLYALPHA_COMPOSE_NAMESPACE:-onlyalpha-dev}-database
    internal: true
  application:
    name: ${ONLYALPHA_COMPOSE_NAMESPACE:-onlyalpha-dev}-application

volumes:
  postgres-data:
    name: ${ONLYALPHA_COMPOSE_NAMESPACE:-onlyalpha-dev}-postgres-data
  clickhouse-data:
    name: ${ONLYALPHA_COMPOSE_NAMESPACE:-onlyalpha-dev}-clickhouse-data
  user-data:
    name: ${ONLYALPHA_COMPOSE_NAMESPACE:-onlyalpha-dev}-user-data
    # Ordinary dev starts only against an existing store. The runner selects the
    # external reference to prevent Compose volume reconciliation/recreation.
    external: ${ONLYALPHA_DEV_EXISTING_USER_DATA:-false}
  agent-state:
    name: ${ONLYALPHA_COMPOSE_NAMESPACE:-onlyalpha-dev}-agent-state
  agent-locks:
    name: ${ONLYALPHA_COMPOSE_NAMESPACE:-onlyalpha-dev}-agent-locks
