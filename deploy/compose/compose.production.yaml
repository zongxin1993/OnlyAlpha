services:
  postgres:
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "5"

  clickhouse:
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "5"

  user-data-initializer:
    image: ${ONLYALPHA_OPERATOR_IMAGE:-onlyalpha-operator:0.9.8}
    profiles:
      - tools
    restart: "no"
    user: "0:0"
    entrypoint: ["chown"]
    command: ["10001:10001", "/var/lib/onlyalpha"]
    volumes:
      - user-data:/var/lib/onlyalpha

  operator:
    image: ${ONLYALPHA_OPERATOR_IMAGE:-onlyalpha-operator:0.9.8}
    build:
      context: ../..
      dockerfile: deploy/compose/Dockerfile.acceptance
      target: operator
      args:
        ONLYALPHA_BUILD_SOURCE_REVISION: ${ONLYALPHA_BUILD_SOURCE_REVISION:-}
    profiles:
      - tools
    restart: "no"
    entrypoint: []
    environment:
      ONLYALPHA_POSTGRES_DSN: ${ONLYALPHA_POSTGRES_DSN:?set ONLYALPHA_POSTGRES_DSN with URL-encoded credentials}
      ONLYALPHA_CLICKHOUSE_URL: http://onlyalpha-clickhouse:8123
      ONLYALPHA_CLICKHOUSE_USER: ${ONLYALPHA_CLICKHOUSE_USER}
      ONLYALPHA_CLICKHOUSE_PASSWORD: ${ONLYALPHA_CLICKHOUSE_PASSWORD}
      ONLYALPHA_CLICKHOUSE_DATABASE: ${ONLYALPHA_CLICKHOUSE_DATABASE:-onlyalpha}
      ONLYALPHA_CLICKHOUSE_STORAGE_POLICY: hot_cold
    volumes:
      - user-data:/var/lib/onlyalpha
      - ${ONLYALPHA_BACKUP_PATH:?set ONLYALPHA_BACKUP_PATH}:/var/lib/onlyalpha-backups
    networks:
      - database

  binance-golden-provisioner:
    image: ${ONLYALPHA_OPERATOR_IMAGE:-onlyalpha-operator:0.9.8}
    build:
      context: ../..
      dockerfile: deploy/compose/Dockerfile.acceptance
      target: operator
      args:
        ONLYALPHA_BUILD_SOURCE_REVISION: ${ONLYALPHA_BUILD_SOURCE_REVISION:-}
    profiles:
      - binance-certification
    restart: "no"
    entrypoint: []
    environment:
      ONLYALPHA_POSTGRES_DSN: ${ONLYALPHA_POSTGRES_DSN:?set ONLYALPHA_POSTGRES_DSN with URL-encoded credentials}
      ONLYALPHA_CLICKHOUSE_URL: http://onlyalpha-clickhouse:8123
      ONLYALPHA_CLICKHOUSE_USER: ${ONLYALPHA_CLICKHOUSE_USER}
      ONLYALPHA_CLICKHOUSE_PASSWORD: ${ONLYALPHA_CLICKHOUSE_PASSWORD}
      ONLYALPHA_CLICKHOUSE_DATABASE: ${ONLYALPHA_CLICKHOUSE_DATABASE:-onlyalpha}
      ONLYALPHA_CLICKHOUSE_STORAGE_POLICY: hot_cold
      ONLYALPHA_BINANCE_API_KEY: ${ONLYALPHA_BINANCE_API_KEY:-}
      ONLYALPHA_BINANCE_API_SECRET: ${ONLYALPHA_BINANCE_API_SECRET:-}
    depends_on:
      postgres:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
    volumes:
      - user-data:/var/lib/onlyalpha
      - ${ONLYALPHA_PRODUCT_CONFIG_PATH:?set ONLYALPHA_PRODUCT_CONFIG_PATH}:/var/lib/onlyalpha-product
      - ${ONLYALPHA_A0_GOLDEN_BUNDLE_PATH:-${ONLYALPHA_PRODUCT_CONFIG_PATH}}:/var/lib/onlyalpha-golden:ro
    networks:
      - database
      - binance-egress

  onlyalpha-http-server:
    image: ${ONLYALPHA_OPERATOR_IMAGE:-onlyalpha-operator:0.9.8}
    restart: unless-stopped
    entrypoint: ["onlyalpha-http-server"]
    command:
      - --user-data-root
      - /var/lib/onlyalpha
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --backtest-product-config
      - /etc/onlyalpha/product/binance-spot.json
      - --backtest-product-config
      - /etc/onlyalpha/product/binance-usdm.json
      - --backtest-market-resource
      - /etc/onlyalpha/product/binance-spot-reference.json
      - --backtest-market-resource
      - /etc/onlyalpha/product/binance-usdm-public-reference.json
      - --backtest-market-resource
      - /etc/onlyalpha/product/binance-usdm-account-reference.json
      - --agent-node-url
      - http://onlyalpha-agent:8010
      - --agent-control-token-file
      - /run/secrets/onlyalpha_agent_control_token
    environment:
      ONLYALPHA_POSTGRES_DSN: ${ONLYALPHA_POSTGRES_DSN:?set ONLYALPHA_POSTGRES_DSN with URL-encoded credentials}
      ONLYALPHA_CLICKHOUSE_URL: http://onlyalpha-clickhouse:8123
      ONLYALPHA_CLICKHOUSE_USER: ${ONLYALPHA_CLICKHOUSE_USER}
      ONLYALPHA_CLICKHOUSE_PASSWORD: ${ONLYALPHA_CLICKHOUSE_PASSWORD}
      ONLYALPHA_CLICKHOUSE_DATABASE: ${ONLYALPHA_CLICKHOUSE_DATABASE:-onlyalpha}
      ONLYALPHA_CLICKHOUSE_STORAGE_POLICY: hot_cold
    depends_on:
      postgres:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
    ports:
      - "${ONLYALPHA_HTTP_BIND_ADDRESS:-127.0.0.1}:${ONLYALPHA_HTTP_PORT:-8000}:8000"
    volumes:
      - user-data:/var/lib/onlyalpha
      - ${ONLYALPHA_PRODUCT_CONFIG_PATH:?set ONLYALPHA_PRODUCT_CONFIG_PATH}:/etc/onlyalpha/product:ro
    secrets:
      - onlyalpha_agent_control_token
    networks:
      - database
      - agent-control

  onlyalpha-agent:
    image: ${ONLYALPHA_OPERATOR_IMAGE:-onlyalpha-operator:0.9.9}
    restart: unless-stopped
    entrypoint: ["onlyalpha-agent"]
    command:
      - serve
      - --durable-root
      - /var/lib/onlyalpha-agent
      - --coordination-root
      - /var/run/onlyalpha-agent
      - --product-api-url
      - http://onlyalpha-http-server:8000
      - --product-api-contract
      - /etc/onlyalpha/contracts/product-api/v2/openapi.json
      - --product-token-file
      - /run/secrets/onlyalpha_agent_product_token
      - --model-api-url
      - ${ONLYALPHA_AGENT_MODEL_API_URL:?set ONLYALPHA_AGENT_MODEL_API_URL}
      - --model-token-file
      - /run/secrets/onlyalpha_agent_model_token
      - --control-token-file
      - /run/secrets/onlyalpha_agent_control_token
      - --replica-count
      - "1"
      - --host
      - 0.0.0.0
      - --port
      - "8010"
    depends_on:
      onlyalpha-http-server:
        condition: service_started
    volumes:
      - agent-state:/var/lib/onlyalpha-agent
      - agent-locks:/var/run/onlyalpha-agent
      - ../../contracts:/etc/onlyalpha/contracts:ro
    secrets:
      - onlyalpha_agent_control_token
      - onlyalpha_agent_product_token
      - onlyalpha_agent_model_token
    networks:
      - agent-control
      - model-egress

  research-worker:
    image: ${ONLYALPHA_OPERATOR_IMAGE:-onlyalpha-operator:0.9.8}
    restart: unless-stopped
    entrypoint: ["onlyalpha-research-worker"]
    command: ["--user-data-root", "/var/lib/onlyalpha"]
    environment:
      ONLYALPHA_POSTGRES_DSN: ${ONLYALPHA_POSTGRES_DSN:?set ONLYALPHA_POSTGRES_DSN with URL-encoded credentials}
    depends_on:
      postgres:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
    volumes:
      - user-data:/var/lib/onlyalpha
    networks:
      - database

  backtest-worker:
    image: ${ONLYALPHA_OPERATOR_IMAGE:-onlyalpha-operator:0.9.8}
    restart: unless-stopped
    entrypoint: ["onlyalpha-backtest-worker"]
    command:
      - --user-data-root
      - /var/lib/onlyalpha
      - --backtest-product-config
      - /etc/onlyalpha/product/binance-spot.json
      - --backtest-product-config
      - /etc/onlyalpha/product/binance-usdm.json
      - --backtest-market-resource
      - /etc/onlyalpha/product/binance-spot-reference.json
      - --backtest-market-resource
      - /etc/onlyalpha/product/binance-usdm-public-reference.json
      - --backtest-market-resource
      - /etc/onlyalpha/product/binance-usdm-account-reference.json
    environment:
      ONLYALPHA_POSTGRES_DSN: ${ONLYALPHA_POSTGRES_DSN:?set ONLYALPHA_POSTGRES_DSN with URL-encoded credentials}
      ONLYALPHA_BACKTEST_ACCEPTANCE_BARRIER_PATH: ${ONLYALPHA_BACKTEST_ACCEPTANCE_BARRIER_PATH:-}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - user-data:/var/lib/onlyalpha
      - ${ONLYALPHA_PRODUCT_CONFIG_PATH:?set ONLYALPHA_PRODUCT_CONFIG_PATH}:/etc/onlyalpha/product:ro
    networks:
      - database

volumes:
  user-data:
    name: ${ONLYALPHA_USER_DATA_VOLUME:-onlyalpha-user-data}
  agent-state:
    name: ${ONLYALPHA_AGENT_STATE_VOLUME:-onlyalpha-agent-state}
  agent-locks:
    name: ${ONLYALPHA_AGENT_LOCK_VOLUME:-onlyalpha-agent-locks}

secrets:
  onlyalpha_agent_control_token:
    file: ${ONLYALPHA_AGENT_CONTROL_TOKEN_PATH:?set ONLYALPHA_AGENT_CONTROL_TOKEN_PATH}
  onlyalpha_agent_product_token:
    file: ${ONLYALPHA_AGENT_PRODUCT_TOKEN_PATH:?set ONLYALPHA_AGENT_PRODUCT_TOKEN_PATH}
  onlyalpha_agent_model_token:
    file: ${ONLYALPHA_AGENT_MODEL_TOKEN_PATH:?set ONLYALPHA_AGENT_MODEL_TOKEN_PATH}

networks:
  agent-control:
    name: ${ONLYALPHA_AGENT_CONTROL_NETWORK:-onlyalpha-agent-control}
    internal: true
  model-egress:
    name: ${ONLYALPHA_AGENT_MODEL_EGRESS_NETWORK:-onlyalpha-agent-model-egress}
  binance-egress:
    name: ${ONLYALPHA_BINANCE_EGRESS_NETWORK:-onlyalpha-binance-egress}
