name: onlyalpha-p93-test

services:
  operator:
    build:
      target: acceptance-operator

  binance-golden-provisioner:
    build:
      target: acceptance-operator

  postgres:
    restart: "no"

  clickhouse:
    restart: "no"

  acceptance:
    image: ${ONLYALPHA_ACCEPTANCE_IMAGE:-onlyalpha-p93-acceptance:0.9.8}
    build:
      context: ../..
      dockerfile: deploy/compose/Dockerfile.acceptance
      target: acceptance
    restart: "no"
    environment:
      ONLYALPHA_TEST_POSTGRES_DSN: postgresql://${ONLYALPHA_POSTGRES_USER}:${ONLYALPHA_POSTGRES_PASSWORD}@onlyalpha-postgres:5432/onlyalpha_test
      ONLYALPHA_POSTGRES_RESTORE_TEST_DSN: postgresql://${ONLYALPHA_POSTGRES_USER}:${ONLYALPHA_POSTGRES_PASSWORD}@onlyalpha-postgres:5432/onlyalpha_restore_test
      ONLYALPHA_TEST_CLICKHOUSE_URL: http://onlyalpha-clickhouse:8123
      ONLYALPHA_TEST_CLICKHOUSE_USER: ${ONLYALPHA_CLICKHOUSE_USER}
      ONLYALPHA_TEST_CLICKHOUSE_PASSWORD: ${ONLYALPHA_CLICKHOUSE_PASSWORD}
      ONLYALPHA_TEST_CLICKHOUSE_STORAGE_POLICY: hot_cold
    depends_on:
      postgres:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
    networks:
      - database

  acceptance-client:
    image: ${ONLYALPHA_PRODUCT_ACCEPTANCE_CLIENT_IMAGE:-onlyalpha-product-acceptance-client:a0}
    build:
      context: ../..
      dockerfile: deploy/compose/Dockerfile.acceptance
      target: product-acceptance-client
    profiles:
      - product-acceptance
    restart: "no"
    environment:
      ONLYALPHA_PRODUCT_API_URL: http://onlyalpha-http-server:8000
      ONLYALPHA_ACCEPTANCE_TIMEOUT_SECONDS: ${ONLYALPHA_ACCEPTANCE_TIMEOUT_SECONDS:-120}
      ONLYALPHA_ACCEPTANCE_DEFINITION_JSON: ${ONLYALPHA_ACCEPTANCE_DEFINITION_JSON:-}
      ONLYALPHA_ACCEPTANCE_BACKTEST_JSON: ${ONLYALPHA_ACCEPTANCE_BACKTEST_JSON:-}
    networks:
      - database

networks:
  database:
    name: onlyalpha-p93-test
    internal: true
